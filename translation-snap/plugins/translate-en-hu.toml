# One plugin: dev/gen-plugins.py turns this into the snapcraft component,
# models/translate-en-hu/{myna-text-model.json,NOTICE} and catalog.json.
# config.yml stays hand-written. Contract: .kb/text-plugin-contract.md.
# Scaffolded by myna-bench plugin-scaffold: download_bytes is the file sum
# until the component is packed, spot_check is for a native speaker to add.
id = "bergamot-mozilla-en-hu"
component = "model-translate-en-hu"
snap = "myna-translation"
kind = "translate"
task = "text.translate"
class = "translate"
needs = "dictation"
language = "en"
to = "hu"
config = "config.yml"
license = "MPL-2.0"
attribution = "Mozilla and contributors, Firefox Translations (version 2.1)"
source = "https://github.com/mozilla/firefox-translations-models"
download_bytes = 32481280
entry_revision = 1
curated = true
pin = "mozilla firefox-translations en-hu mozilla 2.1"
locales = ["en"]
summary = "English to Hungarian translation (Firefox Translations)"
description = """\
Mozilla's Firefox Translations English to Hungarian student model
(MPL-2.0), run by bergamot-translator. About 36 MB."""
notice = """\
model-translate-en-hu: the Firefox Translations English to Hungarian student
model (version 2.1), Copyright Mozilla and contributors,
licensed under the Mozilla Public License 2.0 (LICENSE in this component).

Source: Mozilla's Firefox Translations models,
https://github.com/mozilla/firefox-translations-models (the files themselves
are served from the Remote Settings collection "translations-models" of
https://firefox.settings.services.mozilla.com). The model files are shipped
unmodified; their sha256 are:"""
notice_tail = """\
config.yml and myna-text-model.json are Canonical's own (AGPL-3.0-or-later).
The runtime that executes the model, bergamot-translator (MPL-2.0), and its
bundled libraries are noted in the myna-translation snap's NOTICE."""

[[params]]
name = "language"
kind = "language"
role = "source"
required = true

[[params]]
name = "to"
kind = "language"
role = "target"
required = true

# DECISIONS 7.4: Mozilla published no FLORES COMET for this pair
# (quality not measured): the 0.40 chrF floor and the spot check apply.
[gate]

[step]
id = "translate"
stage = "translate"

[hardware]
arch = ["amd64"]
min_ram_mb = 512

