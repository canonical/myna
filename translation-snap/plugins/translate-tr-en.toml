# One plugin: dev/gen-plugins.py turns this into the snapcraft component,
# models/translate-tr-en/{myna-text-model.json,NOTICE} and catalog.json.
# config.yml stays hand-written. Contract: .kb/text-plugin-contract.md.
# Scaffolded by myna-bench plugin-scaffold: download_bytes is the file sum
# until the component is packed, spot_check is for a native speaker to add.
id = "bergamot-tiny-tr-en"
component = "model-translate-tr-en"
snap = "myna-translation"
kind = "translate"
task = "text.translate"
class = "translate"
needs = "dictation"
language = "tr"
to = "en"
config = "config.yml"
license = "MPL-2.0"
attribution = "Mozilla and contributors, Firefox Translations (tiny 1.0)"
source = "https://github.com/mozilla/firefox-translations-models"
download_bytes = 19120128
entry_revision = 1
curated = true
pin = "mozilla firefox-translations tr-en tiny 1.0"
locales = ["tr"]
summary = "Turkish to English translation (Firefox Translations tiny)"
description = """\
Mozilla's Firefox Translations Turkish to English student model
(MPL-2.0), run by bergamot-translator. About 23 MB."""
notice = """\
model-translate-tr-en: the Firefox Translations Turkish to English student
model "tiny" (version 1.0), Copyright Mozilla and contributors,
licensed under the Mozilla Public License 2.0 (LICENSE in this component).

Source: Mozilla's Firefox Translations models,
https://github.com/mozilla/firefox-translations-models (the files themselves
are served from the Remote Settings collection "translations-models" of
https://firefox.settings.services.mozilla.com). The model files are shipped
unmodified; their sha256 are:"""
notice_tail = """\
config.yml and myna-text-model.json are Canonical's own (AGPL-3.0-or-later).
The runtime that executes the model, bergamot-translator (MPL-2.0), and its
bundled libraries are noted in the myna-translation snap's NOTICE."""

[[params]]
name = "language"
kind = "language"
role = "source"
required = true

[[params]]
name = "to"
kind = "language"
role = "target"
required = true

# DECISIONS 7.4: vendor COMET is Mozilla's FLORES figure from the model's
# metadata.json (models/tiny/tren/metadata.json); no section 5 floor.
[gate]
vendor_comet = 0.8718

[step]
id = "translate"
stage = "translate"

[hardware]
arch = ["amd64"]
min_ram_mb = 512

