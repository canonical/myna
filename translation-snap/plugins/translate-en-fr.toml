# One plugin: dev/gen-plugins.py turns this into the snapcraft component,
# models/translate-en-fr/{myna-text-model.json,NOTICE} and catalog.json.
# config.yml stays hand-written. Contract: .kb/text-plugin-contract.md.
id = "bergamot-base-memory-en-fr"
component = "model-translate-en-fr"
snap = "myna-translation"
kind = "translate"
task = "text.translate"
class = "translate"
needs = "dictation"
language = "en"
to = "fr"
config = "config.yml"
license = "MPL-2.0"
attribution = "Mozilla and contributors, Firefox Translations (base-memory 2.0)"
source = "https://github.com/mozilla/firefox-translations-models"
download_bytes = 33353728
entry_revision = 1
curated = true
pin = "mozilla firefox-translations en-fr base-memory 2.0"
locales = ["en"]
summary = "English to French translation (Firefox Translations base-memory)"
description = """\
Mozilla's Firefox Translations English to French student model
(MPL-2.0), run by bergamot-translator. About 37 MB."""
notice = """\
model-translate-en-fr: the Firefox Translations English to French student
model "base-memory" (version 2.0), Copyright Mozilla and contributors,
licensed under the Mozilla Public License 2.0 (LICENSE in this component).

Source: Mozilla's Firefox Translations models,
https://github.com/mozilla/firefox-translations-models (the files themselves
are served from the Remote Settings collection "translations-models" of
https://firefox.settings.services.mozilla.com). The model files are shipped
unmodified; their sha256 are:"""
notice_tail = """\
config.yml and myna-text-model.json are Canonical's own (AGPL-3.0-or-later).
The runtime that executes the model, bergamot-translator (MPL-2.0), and its
bundled libraries are noted in the myna-translation snap's NOTICE."""

[[params]]
name = "language"
kind = "language"
role = "source"
required = true

[[params]]
name = "to"
kind = "language"
role = "target"
required = true

# DECISIONS 7.4: en-fr keeps its section 5 and 6 gates (chrF >= 0.58); the
# vendor COMET is Mozilla's FLORES figure from the model's metadata.json.
[gate]
vendor_comet = 0.8697
chrf_min = 0.58
spot_check_waiver = "listed unchecked so the Add step flow and its E2E suite have a pair; never released; native-speaker-spot-checks removes it"

[step]
id = "translate"
stage = "translate"

[hardware]
arch = ["amd64"]
min_ram_mb = 512

