# One plugin: dev/gen-plugins.py turns this into the snapcraft component,
# models/translate-en-ja/{myna-text-model.json,NOTICE} and catalog.json.
# config.yml stays hand-written. Contract: .kb/text-plugin-contract.md.
# Scaffolded by myna-bench plugin-scaffold: download_bytes is the file sum
# until the component is packed, spot_check is for a native speaker to add.
id = "bergamot-base-memory-en-ja"
component = "model-translate-en-ja"
snap = "myna-translation"
kind = "translate"
task = "text.translate"
class = "translate"
needs = "dictation"
language = "en"
to = "ja"
config = "config.yml"
license = "MPL-2.0"
attribution = "Mozilla and contributors, Firefox Translations (base-memory 2.3)"
source = "https://github.com/mozilla/firefox-translations-models"
download_bytes = 45682688
entry_revision = 1
curated = true
pin = "mozilla firefox-translations en-ja base-memory 2.3"
locales = ["en"]
summary = "English to Japanese translation (Firefox Translations base-memory)"
description = """\
Mozilla's Firefox Translations English to Japanese student model
(MPL-2.0), run by bergamot-translator. About 50 MB."""
notice = """\
model-translate-en-ja: the Firefox Translations English to Japanese student
model "base-memory" (version 2.3), Copyright Mozilla and contributors,
licensed under the Mozilla Public License 2.0 (LICENSE in this component).

Source: Mozilla's Firefox Translations models,
https://github.com/mozilla/firefox-translations-models (the files themselves
are served from the Remote Settings collection "translations-models" of
https://firefox.settings.services.mozilla.com). The model files are shipped
unmodified; their sha256 are:"""
notice_tail = """\
config.yml and myna-text-model.json are Canonical's own (AGPL-3.0-or-later).
The runtime that executes the model, bergamot-translator (MPL-2.0), and its
bundled libraries are noted in the myna-translation snap's NOTICE."""

[[params]]
name = "language"
kind = "language"
role = "source"
required = true

[[params]]
name = "to"
kind = "language"
role = "target"
required = true

# DECISIONS 7.4: vendor COMET is Mozilla's FLORES figure from the model's
# metadata.json (models/base-memory/enja/metadata.json); no section 5 floor.
[gate]
vendor_comet = 0.9029

[step]
id = "translate"
stage = "translate"

[hardware]
arch = ["amd64"]
min_ram_mb = 512

