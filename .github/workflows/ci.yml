# CI for myna — runs the build+test suite inside the *same* Canonical Workshop
# environment developers use locally (.workshop/myna.yaml), so "green in CI"
# means "green in the environment you develop in" (constitution Principle IV).
#
# The launch-workshop action installs Workshop on the hosted runner and builds
# the `myna` workshop (Rust toolchain + uv + the in-project pipewire SDK). The
# named actions (`lint`, `test`, `py-test`) are defined in .workshop/myna.yaml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  workshop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # TODO(security): pin to a commit SHA before relying on this in anger —
      # @v1 tracks the latest v1.* and can move under us.
      - uses: canonical/launch-workshop@v1
        with:
          workshop: myna
          # Persist the crate registry and uv cache across runs.
          cache: |
            rust:cargo-registry
            uv:cache

      - name: Rust lint (clippy -D warnings)
        run: workshop run myna lint

      - name: Rust tests (cargo test --workspace)
        run: workshop run myna test

      # Offline Python suite (fake-adapter contract + adapter logic; the
      # real-model / GPU tests skip cleanly). `uv run` syncs the base env first.
      - name: Python tests (pytest)
        run: workshop run myna py-test

  # Static-check battery (feature 006, FR-010/FR-011). Each gate names its
  # violations; all run via the Workshop actions, same as locally.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: canonical/launch-workshop@v1
        with:
          workshop: myna
          cache: |
            rust:cargo-registry
            uv:cache

      - name: Rust format
        run: workshop run myna fmt

      - name: Rust unused dependencies
        run: workshop run myna machete

      # Offline invariant (constitution V): no HTTP/TLS/cloud client crates.
      - name: Rust dependency policy
        run: workshop run myna deny

      - name: Python lint + format
        run: workshop run myna py-lint

      - name: Python types (myna/core, strict)
        run: workshop run myna py-types

      - name: Shell lint
        run: workshop run myna shell-lint

      - name: Workflow lint
        run: workshop run myna workflow-lint

  # Coverage (feature 006, FR-007): both languages measured in the Workshop
  # environment, reports published as artifacts, and the self-hosted patch
  # gate (FR-008) enforced on the PR's changed lines. Project-level coverage
  # is informational (FR-009) until a project threshold is ratified.
  coverage:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — patch-cov needs the merge base.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The use-case exercise dictates from a real LibriSpeech clip. Corpora are
      # generated, not committed, so CI provisions the tier, cached on the
      # generator's hash: the `corpus` action passes no selection args, so the
      # generator (and the fixture writer it shares) is the whole input, and the
      # same hash means the same clips. Only a cache miss pays the ~330 MB
      # LibriSpeech download; the tier itself is a couple of MB, and the source
      # tarball is deliberately not cached.
      - name: Cache real-speech corpus
        uses: actions/cache@v4
        with:
          path: corpus/real
          key: corpus-real-${{ hashFiles('dev/fetch_real_corpus.py', 'dev/generate_fixtures.py') }}

      - uses: canonical/launch-workshop@v1
        with:
          workshop: myna
          cache: |
            rust:cargo-registry
            uv:cache

      - name: Provision real-speech corpus
        run: workshop run myna corpus

      - name: Rust coverage (tests)
        run: workshop run myna cov

      - name: Python coverage (tests)
        run: workshop run myna py-cov

      - name: Use-case exercise (merged exports)
        run: workshop run myna exercise

      - name: Dead-code report
        run: workshop run myna deadcode

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          retention-days: 14
          path: |
            client/target/coverage/
            server/htmlcov/
            server/coverage-*.xml

      - name: Project coverage (informational)
        run: |
          {
            echo "## Project coverage (informational, non-blocking)"
            echo
            python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          for name, path in [
              ("Rust (merged)", "client/target/coverage/rust-merged.cobertura.xml"),
              ("Python (merged)", "server/coverage-merged.cobertura.xml"),
          ]:
              rate = float(ET.parse(path).getroot().get("line-rate")) * 100
              print(f"- {name}: {rate:.1f}% lines")
          EOF
          } >> "$GITHUB_STEP_SUMMARY"

      # Blocking gate (FR-008): 80% of changed coverable lines, 5-line floor,
      # deletion-only and excluded paths cannot false-fail. Exit 2 = fail.
      - name: Patch coverage gate
        run: workshop run myna patch-cov --base "origin/${{ github.base_ref || 'main' }}"
