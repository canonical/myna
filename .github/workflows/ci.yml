# CI for myna — runs the build+test suite inside the *same* Canonical Workshop
# environments developers use locally (.workshop/*.yaml), so "green in CI"
# means "green in the environment you develop in".
#
# The launch-workshop action installs Workshop on the hosted runner and builds
# one workshop per job. `myna` (Rust toolchain + uv + the in-project pipewire
# SDK) carries the client/server suites; `myna-shell` carries the GNOME Shell
# extension's, on a base new enough to run the Shell it targets.
#
# Every job runs one Makefile gate and nothing else (`check`, `test-*`,
# `coverage`), so the gate's definition lives in one place and `make
# preflight` locally is exactly what blocks a merge here.
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # One Makefile gate per workshop. The `myna` workshop's suites run under
  # instrumentation in `coverage` below, so they are not run bare here.
  # myna-noble is Myna Settings on Noble's GTK 4.14 and libadwaita 1.5, the
  # oldest it ships against; myna-shell is the GNOME Shell extension on a base
  # new enough to run the Shell it targets.
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workshop: myna, gate: check, cache: "rust:cargo-registry\nvenv:uv-cache" }
          - { workshop: myna-noble, gate: test-noble }
          - { workshop: myna-shell, gate: test-extension }
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    # A launch takes 4 to 37 minutes; a hung one ran into GitHub's 6 h cap.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/snaps
      - uses: ./.github/actions/apt-cache
        with:
          workshop: ${{ matrix.workshop }}
      # TODO(security): pin to a commit SHA - @v1 tracks the latest v1.*.
      - uses: canonical/launch-workshop@v1
        with:
          workshop: ${{ matrix.workshop }}
          cache: ${{ matrix.cache }}
      # Where the launch's time went, task by task (the action prints none),
      # and what the apt cache was doing if it stalled.
      - if: always()
        run: |
          workshop tasks || true
          tail -n 40 "$RUNNER_TEMP"/apt-cacher-ng/log/apt-cacher.{err,log} || true
      - run: make ${{ matrix.gate }}

  # Static GNOME extension review with shexli. This deliberately does not use
  # the Shell workshop: shexli reviews the bundle layout and JavaScript
  # structure, not live Mutter behaviour. The standalone GJS contract tests
  # under test/ are not part of the shipped bundle and are excluded.
  extension-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: 3v1n0/shexli-ci@main
        with:
          path: extensions/myna-shell
          exclude: |
            test/**

  # The same suites against the NEXT GNOME Shell. Workshop cannot reach it -
  # `workshop init` takes no base newer than ubuntu@26.04 - so the job above
  # only ever sees Shell 50. Ubuntu 26.10 carries Shell 51, and LXD (not a
  # Docker container: GNOME Shell needs logind on a system bus) can host it.
  #
  # Non-blocking on purpose. It tracks a development series and a beta Shell,
  # so it will break for reasons that are not ours; it is here to say when
  # the host's mutter API usage stops loading, not to gate a merge on
  # someone else's upload.
  extension-next:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: canonical/setup-lxd@v1

      - name: Extension tests on the next Shell (LXD)
        run: make test-extension-next

  # Coverage (feature 006, FR-007): both languages measured in the Workshop
  # environment and the self-hosted patch gate (FR-008) enforced on the PR's
  # changed lines. Project-level coverage is informational (FR-009), read
  # locally through `make coverage`.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # fetch-depth: 0 — patch-cov needs the merge base.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The use-case exercise dictates from a LibriSpeech clip. Corpora are
      # generated, not committed, so CI provisions the tier, cached on the
      # generator's hash: the `corpus` action passes no selection args, so the
      # generator (and the fixture writer it shares) is the whole input, and the
      # same hash means the same clips. Only a cache miss pays the ~330 MB
      # LibriSpeech download; the tier itself is a couple of MB, and the source
      # tarball is deliberately not cached.
      - name: Cache english-speech corpus
        uses: actions/cache@v6
        with:
          path: corpus/english
          key: corpus-english-${{ hashFiles('server/src/myna/benchmarker/corpus_english.py', 'server/src/myna/benchmarker/_audio.py', 'dev/generate_fixtures.py') }}

      - uses: ./.github/actions/snaps
      - uses: ./.github/actions/apt-cache
        with:
          workshop: myna
      - uses: canonical/launch-workshop@v1
        with:
          workshop: myna
          cache: |
            rust:cargo-registry
            venv:uv-cache
      # Where the launch's time went, task by task (the action prints none),
      # and what the apt cache was doing if it stalled.
      - if: always()
        run: |
          workshop tasks || true
          tail -n 40 "$RUNNER_TEMP"/apt-cacher-ng/log/apt-cacher.{err,log} || true

      # The `myna` workshop's half of `make test` runs here instrumented, then
      # the blocking patch gate (FR-008: 80% of changed coverable lines, 5-line
      # floor, deletion-only and excluded paths cannot false-fail; exit 2 =
      # fail) against the PR's base. The project-level reports are left to
      # `make coverage` locally; nobody read them here.
      - name: Patch coverage gate
        run: make coverage-gate COV_BASE="origin/${{ github.base_ref || 'main' }}"

      # Which changed lines missed, wanted most when the gate fails.
      - name: Upload the patch coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patch-coverage
          retention-days: 14
          path: client/target/coverage/patch-coverage.html
