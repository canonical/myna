# CodeQL: interprocedural dataflow and taint analysis over the Python and Rust
# trees, the class of finding none of the linters in `make check` reaches.
# Advisory on purpose: findings land in the Security tab and annotate the PR,
# and the job fails only when analysis cannot run, never on a finding, so
# each one is triaged as a decision rather than allow-listed to unblock a
# merge. Weekly as well as per-PR because the query packs move under us.
#
# build-mode none: both extractors work from source (Rust's from `cargo
# metadata`), so no toolchain or PipeWire/GTK headers are needed here.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC, after the audit
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, rust]
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The quality pack on top of the security one: that is the
          # FindBugs-shaped half (resource leaks, dead stores, suspicious
          # comparisons), and the point of running this at all.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
