# On a pushed vX.Y.Z tag: draft its GitHub Release, the annotated tag's message
# followed by .github/release-footer.md as the notes (.kb/releasing.md). The
# draft is published by hand once the snaps and the PPA carry the version, as
# their credentials stay off CI.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # checkout can leave the tag lightweight, without the message.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - run: |
          { git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME"
            cat .github/release-footer.md; } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --notes-file "$RUNNER_TEMP/notes.md" --title "Myna ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
