# Checks the store-edge environment's SNAPCRAFT_STORE_CREDENTIALS without
# building anything. Run it after replacing the secret: a credential the
# store cannot parse, or one about to expire, shows here in a minute rather
# than at the publish step of a release.
name: store credential

on:
  workflow_dispatch:

jobs:
  check:
    if: ${{ vars.SNAP_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    environment: store-edge
    timeout-minutes: 10
    steps:
      - name: Log in with the credential
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          sudo snap install snapcraft --classic
          snapcraft whoami > whoami.txt
          # The account's identity stays out of a public log.
          grep -vE '^(email|username|id):' whoami.txt
          expires=$(sed -n 's/^expires: *//p' whoami.txt)
          if [ "$(date -d "$expires" +%s)" -lt "$(date -d '+30 days' +%s)" ]; then
            echo "::error::the credential expires on $expires: export a new one"
            exit 1
          fi
