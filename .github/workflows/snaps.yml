# The five published snaps, built natively on an amd64 and an arm64 runner
# (snapcraft does not cross-build), smoke-tested there with myna-bench on a few
# LibriSpeech clips, and released. A release tag releases to edge; a manual run
# can release to a branch such as edge/rc1 to try a candidate as a store
# refresh before tagging it, and a tag whose commit was never a candidate is
# refused before anything is built. Each night main is released to
# edge/main, unless it has not moved since the last nightly that did, and the
# Testflinger lab run is started on it: the lab tests main, not the last tag.
#
# Publishing needs the store-edge environment's SNAPCRAFT_STORE_CREDENTIALS
# (snapcraft export-login scoped to these snaps), so it only happens in a
# repository whose SNAP_PUBLISH variable is true. Elsewhere the tag still
# builds and smoke-tests. A snap whose build or smoke fails uploads no
# artifact, so its publish leg fails and the others go ahead.
name: snaps

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Release the builds to CHANNEL
        type: boolean
        default: false
      channel:
        description: Channel to release to, e.g. edge or edge/rc1
        type: string
        default: edge
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Four hours before the lab: a tag's build and publish take that long.
  schedule:
    - cron: "37 22 * * *"

jobs:
  # A release tag releases only a commit already tried as a candidate: a
  # manual run that released it, or its parent before the changelog commit,
  # to a branch and so started upgrade-e2e. That run is what proves the
  # credential, the store's review and the refresh before edge users get
  # the tag.
  candidate:
    if: ${{ github.event_name == 'push' && vars.SNAP_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: dev/release-candidate.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"

  # A nightly whose commit the last successful nightly already released
  # builds nothing.
  fresh:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      stale: ${{ steps.last.outputs.stale }}
    steps:
      - id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/snaps.yml/runs?event=schedule&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')
          echo "last successful nightly: ${last:-none}"
          if [ "$last" = "$GITHUB_SHA" ]; then echo stale=true; else echo stale=false; fi >> "$GITHUB_OUTPUT"

  build:
    needs: [candidate, fresh]
    if: ${{ !cancelled() && needs.candidate.result != 'failure' && needs.fresh.outputs.stale != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        snap: [myna, parakeet, whisper, funasr, nemotron, indicconformer]
        include:
          - snap: myna
            name: myna
          - snap: parakeet
            name: myna-parakeet
            fetch: cd parakeet-snap && ./dev/download-models.sh
            model: parakeet-tdt-0.6b-v3
            component: model-parakeet-int8
          - snap: whisper
            name: myna-whisper
            fetch: cd whisper-snap && ./dev/download-models.sh
            model: tiny
            component: model-tiny
          - snap: funasr
            name: myna-funasr
            fetch: uv run --no-project --with 'modelscope>=1.34' python dev/fetch_funasr_model.py --target ./funasr-snap/components/model-sensevoice-onnx
            model: sensevoice
            component: model-sensevoice
          # Exported from NVIDIA's checkpoints, NeMo and torch in the
          # exporter's own uv environment, as parakeet's fp32 component is.
          - snap: nemotron
            name: myna-nemotron
            fetch: cd nemotron-snap && ./dev/download-models.sh
            model: nemotron-en
            component: model-nemotron-en
          # Cut out of AI4Bharat's checkpoint and exported the same way. Hindi
          # only, so it smokes on Hindi FLEURS clips, not English ones.
          - snap: indicconformer
            name: myna-indicconformer
            fetch: cd indicconformer-snap && ./dev/download-models.sh
            model: indicconformer-hi
            component: model-indicconformer-hi
            smoke: fleurs-smoke:hi_in
    name: build (${{ matrix.snap }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    steps:
      # Full history: dev/version.sh counts commits since the last tag.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The model components and the snapcraft build instance outgrow the
      # runner's free disk otherwise.
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: astral-sh/setup-uv@v6

      - name: Fetch models
        if: matrix.fetch
        run: |
          [ ${{ matrix.snap }} != whisper ] || uv tool install 'huggingface_hub[cli]'
          ${{ matrix.fetch }}

      - name: Stage
        run: ${{ matrix.snap }}-snap/dev/prepare.sh

      - uses: snapcore/action-build@v1
        id: build
        with:
          path: ${{ matrix.snap }}-snap

      # The client needs a desktop session to do anything, so it is only
      # installed; the backends transcribe real speech.
      - name: Smoke (install)
        if: ${{ !matrix.model }}
        run: |
          sudo snap set system experimental.user-daemons=true
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          snap info --verbose ${{ matrix.name }} | sed -n '/^installed/p'

      # psutil is compiled, so the pyz is built per architecture.
      - name: Build myna-bench
        if: matrix.model
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg python3-venv
          dev/build-bench.sh

      - uses: actions/cache@v6
        if: matrix.model && !matrix.smoke
        with:
          path: .cache/librispeech
          key: librispeech-dev-clean

      - uses: actions/cache@v6
        if: matrix.smoke
        with:
          path: ~/.cache/myna/corpus-src
          key: corpus-src-${{ matrix.smoke }}

      - name: Smoke (transcribe)
        if: matrix.model
        run: |
          if [ -n "${{ matrix.smoke }}" ]; then
            python3 myna-bench.pyz download-corpus --preset "${{ matrix.smoke }}" --out corpus/smoke
          else
            python3 myna-bench.pyz download-corpus --out corpus/smoke --select balanced -n 4
          fi
          cat > smoke.yaml <<EOF
          manifest: ./corpus/smoke/manifest.json
          out: ./smoke.jsonl
          sweep_budget_seconds: 900
          targets:
            - snap: ${{ matrix.name }}
              files:
                - ./${{ matrix.snap }}-snap/${{ matrix.name }}_*.snap
                - ./${{ matrix.snap }}-snap/${{ matrix.name }}+${{ matrix.component }}.comp
              models: [${{ matrix.model }}]
          EOF
          sudo python3 myna-bench.pyz run --config smoke.yaml --skip-env-check
          python3 dev/check-smoke.py smoke.jsonl

      - if: always() && matrix.model
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.snap }}-${{ matrix.arch }}
          retention-days: 14
          path: smoke.jsonl
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.snap }}-${{ matrix.arch }}
          retention-days: 14
          path: |
            ${{ matrix.snap }}-snap/*.snap
            ${{ matrix.snap }}-snap/*.comp
            ${{ matrix.snap }}-snap/version/version.metainfo.xml
          if-no-files-found: error

      # What a tester runs: dev/bench-edge.sh against the edge snaps.
      - name: Tester bundle
        if: matrix.snap == 'whisper'
        run: |
          mkdir -p bundle
          cp myna-bench.pyz dev/bench-edge.sh dev/bench-edge.yaml bundle/
      - if: matrix.snap == 'whisper'
        uses: actions/upload-artifact@v7
        with:
          name: myna-bench-${{ matrix.arch }}
          retention-days: 14
          path: bundle/

  publish:
    needs: [candidate, fresh, build]
    if: ${{ !cancelled() && needs.candidate.result != 'failure' && needs.fresh.outputs.stale != 'true' && vars.SNAP_PUBLISH == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        snap: [myna, parakeet, whisper, funasr, nemotron, indicconformer]
    name: publish (${{ matrix.snap }}, ${{ matrix.arch }})
    # publish-snap.sh names the .snap after this runner's architecture.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    environment: store-edge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: snap-${{ matrix.snap }}-${{ matrix.arch }}
          path: ${{ matrix.snap }}-snap
      - name: Upload and release
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          CHANNEL: ${{ inputs.channel || (github.event_name == 'schedule' && 'edge/main') || 'edge' }}
        run: |
          sudo apt-get update && sudo apt-get install -y squashfs-tools
          sudo snap install snapcraft --classic
          dev/publish-snap.sh ${{ matrix.snap }}-snap "$CHANNEL"

  # A candidate on a branch is tried as the upgrade users will get: the
  # store's edge snaps refreshed to it, in the e2e VMs (e2e-tests/suites/upgrade.sh).
  # edge/main is the nightly's, never a candidate.
  upgrade-e2e:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && inputs.publish && !contains(fromJSON('["edge", "latest/edge", "edge/main", "latest/edge/main"]'), inputs.channel) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: gh workflow run e2e.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f upgrade_channel="latest/${CHANNEL#latest/}"

  # The lab installs latest/edge/main, so it runs once every snap is there,
  # whether the nightly or a manual run released them.
  lab:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && (github.event_name == 'schedule' || contains(fromJSON('["edge/main", "latest/edge/main"]'), inputs.channel)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflinger.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
