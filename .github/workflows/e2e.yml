# Myna Settings end-to-end: the real binary, built on the GTK 4.14 floor in
# the myna-noble workshop, driven through AT-SPI on fresh GNOME (scheduled
# runs: also Xubuntu) desktop LXD VMs with the store's latest/edge snaps (e2e-tests/). Provisioned from
# scratch every run, so a regression in the edge snaps shows here too.
# The devel series and the Xubuntu desktop are informational: the former's
# archive breaks for reasons not ours, the latter is being brought up.
name: E2E

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "client/myna-config/**"
      - "client/myna-core/**"
      - "client/data/**"
      - "e2e-tests/**"
      - "fake-snap/**"
      - ".github/workflows/e2e.yml"

jobs:
  # The dictation suite's scripted backend (fake-snap/): built once, shared by
  # every matrix job, which provisions it into the VM's `dictation` stage.
  fake-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Stage the fake-backend snap
        run: fake-snap/dev/prepare.sh
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: fake-snap
      - uses: actions/upload-artifact@v7
        with:
          name: fake-backend-snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7

  e2e:
    needs: fake-backend
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(github.event_name == 'pull_request' && '["noble"]' || '["noble", "resolute", "stonking"]') }}
        desktop: ${{ fromJSON(github.event_name == 'pull_request' && '["gnome"]' || '["gnome", "xubuntu"]') }}
        exclude:
          - { desktop: xubuntu, release: resolute }
          - { desktop: xubuntu, release: stonking }
    # GNOME keeps its release-only names (required checks, artifacts).
    name: ${{ matrix.desktop == 'gnome' && format('e2e ({0})', matrix.release) || format('e2e ({0}, {1})', matrix.desktop, matrix.release) }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.release == 'stonking' || matrix.desktop == 'xubuntu' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: fake-backend-snap
          path: fake-snap
      # Before the workshop, which runs on the same LXD.
      - uses: canonical/setup-lxd@v1
      # TODO(security): pin to a commit SHA - @v1 tracks the latest v1.*.
      - uses: canonical/launch-workshop@v1
        with:
          workshop: myna-noble
          cache: rust:cargo-registry
      # setup-lxd's pool is `dir`, where each suite's snapshot copy is a full
      # 20 GB disk copy; btrfs makes it copy-on-write.
      - run: lxc storage create e2e btrfs size=60GiB
      - run: make e2e E2E_RELEASE=${{ matrix.release }} E2E_DESKTOP=${{ matrix.desktop }}
        env:
          E2E_POOL: e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.desktop == 'gnome' && format('e2e-{0}', matrix.release) || format('e2e-{0}-{1}', matrix.desktop, matrix.release) }}
          retention-days: 14
          path: e2e-tests/.run/artifacts/
