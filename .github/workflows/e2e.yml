# Myna Settings end-to-end: the real binary, built on the GTK 4.14 floor in
# the myna-noble workshop, driven through AT-SPI on fresh GNOME desktop LXD
# VMs with the store's latest/edge snaps (e2e-tests/). Provisioned from
# scratch every run, so a regression in the edge snaps shows here too.
# The devel series is informational: its archive breaks for reasons not ours.
name: E2E

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "client/myna-config/**"
      - "client/myna-core/**"
      - "client/data/**"
      - "e2e-tests/**"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(github.event_name == 'pull_request' && '["noble"]' || '["noble", "resolute", "stonking"]') }}
    name: e2e (${{ matrix.release }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.release == 'stonking' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      # Before the workshop, which runs on the same LXD.
      - uses: canonical/setup-lxd@v1
      # TODO(security): pin to a commit SHA - @v1 tracks the latest v1.*.
      - uses: canonical/launch-workshop@v1
        with:
          workshop: myna-noble
          cache: rust:cargo-registry
      - run: make e2e E2E_RELEASE=${{ matrix.release }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.release }}
          retention-days: 14
          path: e2e-tests/.run/artifacts/
