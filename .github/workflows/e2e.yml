# Myna Settings and dictation end-to-end: the real binary, built on the GTK
# 4.14 floor in the myna-noble workshop, driven through AT-SPI on fresh GNOME,
# Xubuntu (Xfce on X11) and Kubuntu (Plasma 6 on Wayland) desktop LXD VMs
# (e2e-tests/), against the myna snap built from this tree and the store's
# latest/edge backends. Provisioned from scratch every run, so a regression in
# the edge snaps shows here too.
# Blocking, on pull requests and nightly: GNOME on every supported release
# (noble, resolute and the devel series stonking), Xubuntu on noble and
# Kubuntu on resolute. Nobody daily-drives Xfce or Plasma here, so this is
# what catches their regressions. Kubuntu on stonking runs nightly only.
# Nightly, the Xubuntu and Kubuntu screenshots are laid beside the last green
# nightly's in a contact sheet (the `contact-sheet` job); see
# e2e-tests/AGENTS.md.
# A run dispatched with upgrade_channel (snaps.yml does, after releasing a
# candidate) runs only the upgrade suite: the store's edge snaps refreshed to
# that channel.
name: E2E

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}-${{ inputs.upgrade_channel }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upgrade_channel:
        description: Run only the upgrade suite, refreshing to this channel (e.g. latest/edge/rc1)
        type: string
        default: ""
  pull_request:

jobs:
  # Whether this pull request touches what the suites test: every crate the
  # daemon, the HUD and Settings are built from, the snaps and deb that package
  # them, and the suites. Decided here rather than by an `on.paths` filter, so
  # that a pull request outside them still gets an `e2e-result` to require.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=true
          if [ -n "$PR" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > files
            grep -qE '^(client|myna-snap|myna-config-deb|fake-snap|e2e-tests|tests/lib)/|^\.github/workflows/e2e\.yml$' files || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # The dictation suite's scripted backend (fake-snap/): built once, shared by
  # every matrix job, which provisions it into the VM's `dictation` stage.
  fake-backend:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Stage the fake-backend snap
        run: fake-snap/dev/prepare.sh
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: fake-snap
      - uses: actions/upload-artifact@v7
        with:
          name: fake-backend-snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7

  # The myna snap of this tree: the suites test the daemon and HUD as packaged,
  # not the store's older edge build. The build (about 8 minutes) is cached by
  # the content it packs, so a push that touches none of it (e2e-tests, the
  # workflow, the deb) reuses the last snap. A hit carries the version string
  # of the commit that built it; nothing here reads it, and a release is built
  # by its own workflow, not this one.
  myna-snap:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        id: cache
        with:
          path: snap-cache
          key: myna-snap-${{ hashFiles('client/**', 'myna-snap/**', 'LICENSE', 'dev/version.sh', 'dev/stage-*.sh') }}
      - name: Stage the myna snap
        if: steps.cache.outputs.cache-hit != 'true'
        run: myna-snap/dev/prepare.sh
      - uses: snapcore/action-build@v1
        if: steps.cache.outputs.cache-hit != 'true'
        id: build
        with:
          path: myna-snap
      - name: Keep the snap for the cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p snap-cache
          cp "${{ steps.build.outputs.snap }}" snap-cache/
      - uses: actions/upload-artifact@v7
        with:
          name: myna-snap
          path: snap-cache/*.snap
          retention-days: 7

  e2e:
    needs: [fake-backend, myna-snap]
    strategy:
      fail-fast: false
      matrix:
        release: ["resolute"]
        desktop: ["kde"]
        cpus: ["3", "2", "0-2", "0-1"]
    # GNOME keeps its release-only names (artifacts, the contact sheet); the
    # others are "e2e (xubuntu, noble)" and so on.
    name: e2e (${{ matrix.desktop }}, ${{ matrix.release }}, cpus ${{ matrix.cpus }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: fake-backend-snap
          path: fake-snap
      - uses: actions/download-artifact@v8
        with:
          name: myna-snap
          path: myna-snap
      # Before the workshop, which runs on the same LXD. launch-workshop
      # refreshes any other channel to 6/stable, and a downgrade from
      # setup-lxd's latest/candidate leaves `lxd waitready` hanging.
      - uses: canonical/setup-lxd@v1
        with:
          channel: 6/stable
      - uses: ./.github/actions/apt-cache
        with:
          workshop: myna-noble
      # TODO(security): pin to a commit SHA - @v1 tracks the latest v1.*.
      - uses: canonical/launch-workshop@v1
        with:
          workshop: myna-noble
          cache: rust:cargo-registry
      # Where the launch's time went, task by task (the action prints none).
      - if: always()
        run: workshop tasks || true
      # setup-lxd's pool is `dir`, where each suite's snapshot copy is a full
      # 20 GB disk copy; btrfs makes it copy-on-write.
      - run: lxc storage create e2e btrfs size=60GiB
      - run: |
          mkdir -p e2e-tests/.run/artifacts
          ( while sleep 20; do date +%T; ps -eLo psr=,comm= | awk '/CPU [0-9]+\/KVM/' | sort | uniq -c; done \
              > e2e-tests/.run/artifacts/vcpu-psr.log 2>&1 ) &
          E2E_MYNA_SNAP=$(ls "$PWD"/myna-snap/myna_*_amd64.snap) \
            make e2e E2E_RELEASE=${{ matrix.release }} E2E_DESKTOP=${{ matrix.desktop }} \
              SUITES='dictation dictation dictation dictation dictation dictation'
        env:
          E2E_POOL: e2e
          E2E_VM_CPUS: ${{ matrix.cpus }}
          E2E_UPGRADE_CHANNEL: ${{ inputs.upgrade_channel }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.desktop }}-${{ matrix.release }}-cpus${{ matrix.cpus }}
          retention-days: 14
          path: e2e-tests/.run/artifacts/
      # The checkpoints alone, kept longer than the whole artifact: the
      # contact sheet compares with the last green nightly's.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-shots-${{ matrix.desktop }}-${{ matrix.release }}-cpus${{ matrix.cpus }}
          retention-days: 30
          if-no-files-found: ignore
          path: e2e-tests/.run/artifacts/screenshots/

  # The one check to require: every e2e job passed, or none had to run. A
  # skipped matrix job reports under its unexpanded name, so requiring the
  # per-release checks would leave a pull request outside the paths waiting.
  e2e-result:
    if: always()
    needs: [changes, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes=$CHANGES run=$RUN e2e=$E2E"
          [ "$CHANGES" = success ] || exit 1
          [ "$RUN" = false ] || [ "$E2E" = success ]

  # Nightly (and on dispatch): the Xubuntu and Kubuntu screenshots of this run
  # beside the last approved run's. "Approved" is the newest green scheduled or
  # dispatched run on main that kept its screenshots; re-baselining is
  # dispatching E2E on main. Nothing is asserted here: the page is for a human.
  contact-sheet:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !inputs.upgrade_channel }}
    needs: e2e
    strategy:
      fail-fast: false
      matrix:
        set: ["xubuntu-noble", "kde-resolute"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SET: ${{ matrix.set }}
      NAME: screenshots-${{ matrix.set }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 -I e2e-tests/tools/test_contact_sheet.py
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ env.NAME }}
          path: current
      - name: Download the last approved run's screenshots
        run: |
          mkdir -p baseline
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e.yml --branch main --status success --limit 30 \
            --json databaseId,event --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId')
          for id in $ids; do
            [ "$id" != "$GITHUB_RUN_ID" ] || continue
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "$NAME" --dir baseline; then
              echo "baseline: run $id" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            rm -rf baseline; mkdir baseline
          done
          echo "No baseline yet: no green scheduled run on main kept $NAME." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the sheet
        run: |
          mkdir -p current sheet
          python3 -I e2e-tests/tools/contact-sheet.py --current current --baseline baseline \
            --out sheet/index.html --title "$SET: run $GITHUB_RUN_ID vs the last approved run" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: contact-sheet-${{ matrix.set }}
          retention-days: 14
          path: sheet/index.html
