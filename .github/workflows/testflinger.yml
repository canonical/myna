# Nightly lab run (tests/testflinger/): the store's latest/edge snaps on real
# hardware. `accuracy`: the adapter smoke, then each backend's latency and
# accuracy on the languages Myna recommends it for (noble), on one pinned
# machine per platform: latency only compares on the same machine night to
# night, and ceilings.yaml holds each one's ceilings by hostname.
# `continuity`: dictations through the daemon that must not lose audio, idle
# and under load (resolute). Needs repository secrets TESTFLINGER_CLIENT_ID
# and TESTFLINGER_SECRET_KEY; the lab runs only where TESTFLINGER_QUEUE is
# set, which also names continuity's machine unless
# TESTFLINGER_CONTINUITY_QUEUE does.
name: Testflinger

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

jobs:
  lab:
    if: vars.TESTFLINGER_QUEUE != ''
    name: lab (${{ matrix.suite }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: accuracy, platform: intel, queue: 202102-28727}
          - {suite: accuracy, platform: amd, queue: 202104-28937}
          - {suite: accuracy, platform: nvidia, queue: 202202-29946}
          - {suite: accuracy, platform: arm64, queue: 202204-30167}
          - {suite: continuity, platform: resolute, queue: ""}
    # Suites may queue for the same machine, so one waits out the other.
    timeout-minutes: 240
    env:
      TESTFLINGER_CLIENT_ID: ${{ secrets.TESTFLINGER_CLIENT_ID }}
      TESTFLINGER_SECRET_KEY: ${{ secrets.TESTFLINGER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - run: sudo snap install testflinger-cli
      - env:
          QUEUE: ${{ matrix.queue || vars.TESTFLINGER_CONTINUITY_QUEUE || vars.TESTFLINGER_QUEUE }}
        run: make testflinger TESTFLINGER_QUEUE="$QUEUE" TESTFLINGER_SUITE=${{ matrix.suite }}
      - name: Gate verdict
        if: always()
        run: >-
          sed -n '/^\(gate \|continuity: \)/,$p' tests/testflinger/out/${{ matrix.suite }}/artifacts/${{ matrix.suite }}.log >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflinger-${{ matrix.suite }}-${{ matrix.platform }}
          retention-days: 14
          path: tests/testflinger/out/${{ matrix.suite }}/artifacts/
