# Nightly lab run (tests/testflinger/): the store's latest/edge snaps on real
# hardware. `accuracy`: the adapter smoke and a per-language FLEURS accuracy
# gate. `continuity`: dictations through the daemon that must not lose audio,
# idle and under load. Needs repository secrets TESTFLINGER_CLIENT_ID and
# TESTFLINGER_SECRET_KEY and the variable TESTFLINGER_QUEUE; without them the
# jobs are skipped.
name: Testflinger

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

jobs:
  lab:
    if: vars.TESTFLINGER_QUEUE != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [accuracy, continuity]
    # Both suites queue for the same machine, so one waits out the other.
    timeout-minutes: 240
    env:
      TESTFLINGER_CLIENT_ID: ${{ secrets.TESTFLINGER_CLIENT_ID }}
      TESTFLINGER_SECRET_KEY: ${{ secrets.TESTFLINGER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - run: sudo snap install testflinger-cli
      - run: make testflinger TESTFLINGER_QUEUE=${{ vars.TESTFLINGER_QUEUE }} TESTFLINGER_SUITE=${{ matrix.suite }}
      - name: Gate verdict
        if: always()
        run: >-
          sed -n '/^\(gate \|continuity: \)/,$p' tests/testflinger/out/${{ matrix.suite }}/artifacts/${{ matrix.suite }}.log >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflinger-${{ matrix.suite }}
          retention-days: 14
          path: tests/testflinger/out/${{ matrix.suite }}/artifacts/
