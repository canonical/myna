# Nightly lab run (tests/testflinger/): the store's latest/edge snaps on real
# hardware. `accuracy`: the adapter smoke and a per-language FLEURS accuracy
# gate (noble). `continuity`: dictations through the daemon that must not lose
# audio, idle and under load (resolute). Needs repository secrets
# TESTFLINGER_CLIENT_ID and TESTFLINGER_SECRET_KEY and per-suite queue
# variables TESTFLINGER_ACCURACY_QUEUE / TESTFLINGER_CONTINUITY_QUEUE (each
# falling back to TESTFLINGER_QUEUE); suites with no queue resolved are
# skipped.
name: Testflinger

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

jobs:
  lab:
    if: >-
      vars.TESTFLINGER_QUEUE != ''
      || vars.TESTFLINGER_ACCURACY_QUEUE != ''
      || vars.TESTFLINGER_CONTINUITY_QUEUE != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [accuracy, continuity]
        exclude:
          - suite: ${{ (vars.TESTFLINGER_ACCURACY_QUEUE || vars.TESTFLINGER_QUEUE) == '' && 'accuracy' || 'none' }}
          - suite: ${{ (vars.TESTFLINGER_CONTINUITY_QUEUE || vars.TESTFLINGER_QUEUE) == '' && 'continuity' || 'none' }}
    # Both suites may queue for the same machine, so one waits out the other.
    timeout-minutes: 240
    env:
      TESTFLINGER_CLIENT_ID: ${{ secrets.TESTFLINGER_CLIENT_ID }}
      TESTFLINGER_SECRET_KEY: ${{ secrets.TESTFLINGER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - run: sudo snap install testflinger-cli
      - env:
          ACCURACY_QUEUE: ${{ vars.TESTFLINGER_ACCURACY_QUEUE || vars.TESTFLINGER_QUEUE }}
          CONTINUITY_QUEUE: ${{ vars.TESTFLINGER_CONTINUITY_QUEUE || vars.TESTFLINGER_QUEUE }}
        run: |
          case ${{ matrix.suite }} in
            accuracy) queue=$ACCURACY_QUEUE ;;
            continuity) queue=$CONTINUITY_QUEUE ;;
          esac
          make testflinger TESTFLINGER_QUEUE="$queue" TESTFLINGER_SUITE=${{ matrix.suite }}
      - name: Gate verdict
        if: always()
        run: >-
          sed -n '/^\(gate \|continuity: \)/,$p' tests/testflinger/out/${{ matrix.suite }}/artifacts/${{ matrix.suite }}.log >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflinger-${{ matrix.suite }}
          retention-days: 14
          path: tests/testflinger/out/${{ matrix.suite }}/artifacts/
