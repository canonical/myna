# The myna-config deb, built with sbuild in a clean chroot for every series
# the PPA carries, so a series that fails to build shows here rather than on
# Launchpad after an upload. The .debs are kept as artifacts for testers.
#
# Runs on a push to any branch, main and PR branches alike, that changes what
# the deb packs: the paths below are myna-config-deb/build-source.sh's inputs
# and must be kept in step with it.
name: Deb

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "myna-config-deb/**"
      - "client/myna-config/**"
      - "client/myna-core/**"
      - "client/myna-platform/**"
      - "client/myna-freedesktop/**"
      - "client/data/**"
      - "client/build-support/**"
      - "client/Cargo.toml"
      - "client/Cargo.lock"
      - "extensions/myna-shell/**"
      - "dev/version.sh"
      - "dev/stage-extension.sh"
      - "dev/check-shell-version.sh"
      - ".github/workflows/deb.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        series: [noble, resolute, stonking]
        arch: [amd64, arm64]
    name: build (${{ matrix.series }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      # Full history: dev/version.sh counts commits since the last tag.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # devscripts is rmadison, for dev/check-shell-version.sh. Ubuntu
      # restricts unprivileged user namespaces, which unshare mode needs.
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sbuild autopkgtest mmdebstrap uidmap distro-info devscripts dpkg-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cargo install --locked cargo-vendor-filterer@0.5.18

      # The runner's sbuild predates creating its own unshare chroot. -updates
      # carries noble's versioned Rust toolchain.
      - name: Chroot
        run: |
          series=${{ matrix.series }}
          mirror=http://archive.ubuntu.com/ubuntu
          [ ${{ matrix.arch }} = amd64 ] || mirror=http://ports.ubuntu.com/ubuntu-ports
          mkdir -p ~/.cache/sbuild
          mmdebstrap --variant=buildd --mode=unshare \
            "$series" ~/.cache/sbuild/"$series"-${{ matrix.arch }}.tar \
            "deb $mirror $series main universe" \
            "deb $mirror $series-updates main universe" \
            "deb $mirror $series-security main universe"

      # --no-clean-source: the host lacks noble's build-deps, which a clean
      # on the host would demand. The autopkgtest installs the built deb in a
      # fresh chroot, the only place its maintainer scripts run before a user's
      # machine. sbuild exits 0 whatever lintian and autopkgtest say, so their
      # verdicts are read from its log. The two suppressed tags are noble's
      # lintian not knowing the current Standards-Version and watch format.
      - name: Build, lintian and autopkgtest
        run: |
          series=${{ matrix.series }}
          SERIES=$series make build-deb \
            SBUILD_ARGS="--chroot-mode=unshare --no-clean-source --run-lintian --lintian-opt=--suppress-tags=newer-standards-version,unknown-debian-watch-file-standard --run-autopkgtest --autopkgtest-virt-server=unshare --autopkgtest-virt-server-opts=--release=$series --autopkgtest-virt-server-opts=--arch=${{ matrix.arch }}"
          log=$(ls target/deb/"$series"/myna-config_*_${{ matrix.arch }}.build)
          grep -E '^([EW]: |[a-z-]+ +(PASS|FAIL|SKIP)|(Lintian|Autopkgtest): )' "$log"
          grep -qx 'Lintian: pass' "$log"
          grep -qx 'Autopkgtest: pass' "$log"

      # sbuild prints only "dpkg-buildpackage died"; the why is in its log,
      # whose own name carries a timestamp with colons, which artifacts refuse.
      - if: failure()
        run: cp -L target/deb/${{ matrix.series }}/myna-config_*_${{ matrix.arch }}.build sbuild.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sbuild-log-${{ matrix.series }}-${{ matrix.arch }}
          retention-days: 14
          path: sbuild.log

      - uses: actions/upload-artifact@v7
        with:
          name: myna-config-${{ matrix.series }}-${{ matrix.arch }}
          retention-days: 14
          path: target/deb/${{ matrix.series }}/*.deb
          if-no-files-found: error
