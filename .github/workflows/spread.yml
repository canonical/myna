# Confined end-to-end tests via spread (feature 006, US5; decision record:
# specs/006-coverage-quality-gates/spread-decision.md).
#
# Nightly + on changes to the snap/packaging seams. Builds the client snap
# and the fake-backend test snap, builds spread from a pinned upstream
# commit (supply-chain choice recorded in the decision record), and runs the
# confined-e2e suite on a clean qemu ubuntu-24.04-64 VM (hosted-runner KVM).
#
# Supersession plan: once this is green for two weeks, the bespoke smoke job
# in snap.yml shrinks to build-only and its smoke assertions live here.
name: Spread

on:
  schedule:
    - cron: "41 4 * * *" # nightly 04:41 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "myna-snap/**"
      - "fake-snap/**"
      - "spread.yaml"
      - "tests/spread/**"
      - ".github/workflows/spread.yml"

# Pinned upstream commit (decision record; bump deliberately).
env:
  # The 2026.07.12 tag (latest/stable at pinning time). Its original commit
  # (052d7a1) is gone from the repo after an upstream force-push; pin the
  # tag's current commit so the checkout actually resolves.
  SPREAD_COMMIT: 32cad07bfd7fffb395f6c6134b68b1c24f9490c0

jobs:
  confined-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: KVM available
        run: |
          if [ ! -w /dev/kvm ]; then echo "hosted runner lost KVM"; exit 1; fi
          sudo apt-get update && sudo apt-get install -y cpu-checker && sudo kvm-ok

      # The qemu backend needs a primed image at ~/.spread/qemu/<system>.img
      # (SSH on 22, ubuntu/ubuntu password auth). Built from the noble cloud
      # image + a cloud-init seed, primed by booting once; cached by hash of
      # this step. Mirrors the recorded local procedure.
      - name: Cache qemu image
        id: img-cache
        uses: actions/cache@v4
        with:
          path: ~/.spread/qemu
          key: spread-qemu-ubuntu-24.04-64-v1

      - name: Build + prime qemu image
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get install -y qemu-system-x86 cloud-image-utils sshpass
          mkdir -p ~/.spread/qemu && cd ~/.spread/qemu
          wget -q https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img \
            -O ubuntu-24.04-64.img
          HASH=$(openssl passwd -6 ubuntu)
          printf '#cloud-config\nssh_pwauth: true\nusers:\n  - name: ubuntu\n    sudo: ALL=(ALL) NOPASSWD:ALL\n    lock_passwd: false\n    passwd: %s\n' "$HASH" > user-data
          printf 'instance-id: myna-spread-seed\nlocal-hostname: myna-spread\n' > meta-data
          cloud-localds seed.iso user-data meta-data
          qemu-system-x86_64 -enable-kvm -m 2G -smp 2 -nographic \
            -drive file=ubuntu-24.04-64.img,if=virtio,format=qcow2 \
            -drive file=seed.iso,if=virtio,format=raw \
            -netdev user,id=n1,hostfwd=tcp::10022-:22 \
            -device virtio-net-pci,netdev=n1 &
          QEMU=$!
          for _ in $(seq 1 90); do
            if sshpass -p ubuntu ssh -o StrictHostKeyChecking=no \
                 -o PreferredAuthentications=password -o PubkeyAuthentication=no \
                 -p 10022 ubuntu@localhost 'cloud-init status --wait' 2>/dev/null; then
              break
            fi
            sleep 5
          done
          sshpass -p ubuntu ssh -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -p 10022 ubuntu@localhost 'sudo poweroff' || true
          wait $QEMU || true

      - name: Stage + build client snap
        run: myna-snap/dev/prepare.sh
      - uses: snapcore/action-build@v1
        id: client
        with:
          path: myna-snap

      - name: Stage + build fake-backend snap
        run: fake-snap/dev/prepare.sh
      - uses: snapcore/action-build@v1
        id: backend
        with:
          path: fake-snap

      - name: Build spread (pinned commit)
        run: |
          sudo apt-get install -y golang-go
          # Same script as local runs: pins the commit, applies the -cpu host
          # patch (qemu64 lacks x86-64-v2; numpy/CTranslate2 refuse to run),
          # caches at .cache/spread/spread.
          ./dev/spread-build.sh

      # The task resolves the snaps from the project dir (sent to the VM).
      - name: Run confined-e2e
        run: ./.cache/spread/spread qemu:ubuntu-24.04-64:tests/spread/confined-e2e
