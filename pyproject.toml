[project]
name = "myna"
version = "0.0.1"
description = "Speech to text on Ubuntu — dictation client and candidate-adapter testbed"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myna"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
