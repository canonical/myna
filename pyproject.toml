[project]
name = "myna"
version = "0.0.1"
description = "Speech to text on Ubuntu — dictation client and candidate-adapter testbed"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "websockets>=16.0",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.2.1",
]
# Heavy (torch + CUDA); for the Nemotron / FastConformer adapter (T09).
nemotron = [
    "nemo_toolkit[asr]>=2.0",
]

[project.scripts]
myna-server = "myna.server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myna"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["myna"]
branch = true
