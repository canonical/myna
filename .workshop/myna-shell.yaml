# Workshop for the GNOME Shell extension (extensions/myna-shell), separate
# from the main `myna` workshop.
#
# It exists because of one line: `base`. A Workshop SDK cannot carry its own
# base image, so the GNOME Shell version available to a test comes from the
# workshop's base and nothing else, and this project has two shipping targets
# that disagree about it:
#
#   - client/ + server/ ship in a snap on `core24`, so the main workshop's
#     ubuntu@24.04 base is what we ship, and must stay there.
#   - extensions/myna-shell ships to a GNOME desktop. Its metadata.json
#     declares Shell 50/51, which no 24.04 archive has or can have (Shell 50
#     wants mutter 50, gjs 1.86, glib 2.86). The host's pure GJS suites need
#     nothing but gjs, so this workshop provides the Shell version the
#     extension actually targets.
#
# So the extension gets a base that ships a Shell it supports, and the daemon
# keeps the base it ships on. Porting the extension backwards to an older Shell
# would collapse the two again; until then, this tests what we ship.
name: myna-shell
base: ubuntu@26.04
sdks:
  # In-project SDK: GJS + GNOME Shell. See .workshop/shell/sdk.yaml.
  - name: project-shell

# The extension's own suites. Mirrors the `myna` workshop's action style: bash,
# run as the workshop user with the project mounted at /project.
actions:
  # The host's pure GJS contract tests (placement, binary resolution, respawn
  # policy, presence lifecycle, host-composed logic) need no Shell at all.
  # The live compositor behaviour the host drives (dock typing, focus safety,
  # click-through, repositioning) is verified on hardware, not headlessly
  # (T125/R28).
  gjs-test: |
    /project/extensions/myna-shell/test/run-suite.sh

  # The Shell this base actually provides, against the range the extension
  # declares.
  shell-version-probe: |
    gnome-shell --version
    sed -n 's/.*"shell-version": *\[\([^]]*\)\].*/\1/p' /project/extensions/myna-shell/metadata.json
