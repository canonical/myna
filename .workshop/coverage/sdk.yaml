# In-project SDK: coverage + quality-gate tooling (feature 006).
#
# Provisions the tools the Workshop actions in .workshop/myna.yaml need:
#   - cargo-llvm-cov : Rust source-based coverage (llvm-tools: rust SDK)
#   - cargo-deny     : dependency ban/license policy (offline invariant, FR-011)
#   - cargo-machete  : unused workspace dependencies
#   - cargo-audit    : RustSec advisory audit (weekly scheduled gate)
#   - cargo-mutants  : scoped mutation testing (`mutants` action, not a gate)
#   - shellcheck     : dev/*.sh and snap-script lint
#   - actionlint     : .github/workflows lint
# Python tools (diff-cover, ruff, mypy, vulture, pip-audit) ride the server
# dev dependency group (server/pyproject.toml) instead - one lockfile.
name: coverage
summary: Coverage (cargo-llvm-cov) and quality-gate tooling for the myna gates.
