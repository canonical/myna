# Matrix runner config (T11) - see dev/matrix.py.
#
#   sudo server/.venv/bin/python dev/matrix.py --config dev/matrix.yaml
#
# Snaps only: the runner purges any existing install, sideloads the locally
# packed snap plus its components, benchmarks it, and purges again. Anything
# measured outside a snap is not what we ship.
#
# Note what is *absent* here. No engine, no device, no hardware annotation:
# the snap's install hook runs `modelctl use-engine --auto`, so the engine is
# chosen by hardware detection and read back afterwards, and machine provenance
# comes from `modelctl show-machine`. A config can only ever disagree with the
# machine it runs on, so it is not asked.

# Trustworthy WER needs real speech *and* more than one voice: the balanced
# tier round-robins 40 LibriSpeech dev-clean speakers (fixtures/ is plumbing
# only, and corpus/real/manifest.json is all speaker 2277). Swap in
# corpus/librispeech-other/manifest-balanced.json for the hard split.
#
# One entry is not an utterance but a whole chapter concatenated in reading
# order (category "long-form", ~5 min) - regenerated alongside the rest by
# `make bench-corpus` (dev/fetch_real_corpus.py --long-form-minutes). Rolling
# windows, buffer growth, and drift only show up minutes into a session; no
# individual utterance is long enough to exercise them.
manifest: corpus/real/manifest-balanced.json
out: results/bench.jsonl
cold_clip: librispeech-84-121123-0000    # one clip, run first, tagged --cold to measure model load
# clips: []                              # warm sweep clips; omit = whole manifest

# Wall clock for the warm sweep. The balanced tier is ~12 min of audio plus
# the ~5 min long-form clip above (~17 min total), so this is roughly "must
# beat 0.83x real time end to end" - unchanged from the pre-long-form bar,
# just scaled to the larger corpus. A backend that overruns is stamped
# usability_fail with the clips it managed - a product verdict, measured per
# run on the actual hardware rather than predicted from a spec sheet.
sweep_budget_seconds: 850

# Each snap is swept across every model variant its selected engine offers
# (`modelctl list-models`) x every emission mode it supports (batch, and
# streaming where the snap exposes the `streaming` config key), one row per
# combination. Add `models: [tiny, base]` to a target to narrow the variant
# axis - useful when a large weight is known to blow the budget and you only
# want it measured occasionally.
#
# streaming_configs: optional list of {label, settings} dicts, applied only
# when streaming=true. Each entry produces a separate row in the results with
# the label suffixed "-<label>" (e.g. "streaming-arm3s"). Batch mode is always
# run once, unaffected. Snaps without streaming_configs get a single streaming
# row at whatever defaults the snap shipped with.
targets:
  - snap: whisper
    dir: whisper-snap
    # LocalAgreement re-decode: no user-facing latency dial. Commits when two
    # consecutive 1 s-cadence decodes agree; TTFF is content-driven, not config.

  - snap: parakeet
    dir: parakeet-snap
    # SilenceCut chunked-commit: stream-arm-seconds is the primary latency dial.
    # The window must reach arm_s before silence detection activates, so arm_s
    # sets the floor on TTFF. Sweep three points to expose the tradeoff curve;
    # arm15s is the shipped default (murmure's proven constant).
    streaming_configs:
      - label: arm3s
        settings:
          stream-arm-seconds: "3"
      - label: arm8s
        settings:
          stream-arm-seconds: "8"
      - label: arm15s
        settings:
          stream-arm-seconds: "15"

  - snap: sherpa
    dir: sherpa-snap
    # Native 480 ms transducer chunks: latency is baked into the ONNX export,
    # no runtime knob.

  - snap: myna-funasr
    dir: funasr-snap

  # Pure-C CPU runtime. Measured RTF 4.47 on a Ryzen AI 7 350, so it is expected
  # to blow the budget and report usability_fail - measure it anyway, that is
  # the finding.
  - snap: qwen
    dir: qwen-snap

  # Audio8-ASR-0.1B ONNX (feature 010). Ships both cpu and nvidia-gpu engines
  # (like whisper); auto-selection picks cpu on a GPU-less machine.
  - snap: audio8
    dir: audio8-snap

  # nemotron ships only an `nvidia-gpu` engine (devices: allof gpu vendor-id
  # 0x10de, runtime nemo-cuda), so auto-selection finds nothing on a CPU-only
  # machine and the target can only fail. The adapter itself does support
  # `--device cpu`, but packaging a CPU engine was judged not worth it: it is a
  # GPU-oriented FastConformer and would land as usability_fail anyway.
  # Uncomment on a machine with an NVIDIA card.
  # - snap: nemotron
  #   dir: nemotron-snap
  #   # Cache-aware streaming RNNT: att-context-size is the latency/accuracy dial.
  #   # "70,0" = lowest latency (no right context); "70,33" = most context.
  #   # streaming_configs:
  #   #   - label: ctx70.0
  #   #     settings:
  #   #       att-context-size: "70,0"
  #   #   - label: ctx70.13
  #   #     settings:
  #   #       att-context-size: "70,13"
  #   #   - label: ctx70.33
  #   #     settings:
  #   #       att-context-size: "70,33"
