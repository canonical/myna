[project]
name = "myna"
version = "0.0.1"
description = "Speech to text on Ubuntu — dictation client and candidate-adapter testbed"
readme = "../README.md"
requires-python = ">=3.12"
license = { file = "../LICENSE" }
dependencies = [
    "websockets>=16.0",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.2.1",
]
# Heavy (torch + CUDA); for the Nemotron / FastConformer adapter (T09).
nemotron = [
    "nemo_toolkit[asr]>=2.0",
]
# Small transducer snaps (feature 008): Parakeet TDT int8 ONNX via ONNX
# Runtime (no torch), and the sherpa-onnx turnkey streaming runtime.
parakeet = [
    # 1.27.x exactly: sherpa-onnx 1.13.x's native lib needs the VERS_1.27.0
    # version node, and each onnxruntime lib exports only its own (1.28
    # dropped VERS_1.27.0). The sherpa extra resolves its libonnxruntime
    # from this package.
    "onnxruntime>=1.27,<1.28",
]
sherpa = [
    "sherpa-onnx>=1.10",
]

[project.scripts]
myna-server = "myna.server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pyyaml>=6",   # dev/matrix.py config
    "psutil>=5",   # dev/matrix.py peak RSS/VRAM sampling
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myna"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["myna"]
branch = true
