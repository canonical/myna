[project]
name = "myna"
version = "0.0.1"
description = "Speech to text on Ubuntu — dictation client and candidate-adapter testbed"
requires-python = ">=3.12"
# SPDX expression, not a file: hatchling refuses metadata paths outside the
# project dir, and the licence text lives at the repo root (../LICENSE).
license = "AGPL-3.0-or-later"
dependencies = [
    "websockets>=16.0",
    # The IE115 edge resampler (myna.core.resample): a stock OpenAI client
    # sends 24 kHz, the adapters take 16 kHz. Every adapter extra already
    # pulls numpy; this makes the core path (and the fake snap) honest.
    #
    # Split by interpreter on purpose. numpy 1.26 predates Python 3.13: built
    # from sdist on 3.14 (the workshop) it silently mutates the operands of
    # any expression on an array above ~32 KB inside a function (`b = a * 2`
    # changes `a`; its temporary elision misreads 3.14's reference counts).
    # 2.3 is the first release that supports 3.14. The snaps are core24, so
    # they resolve the first line.
    "numpy>=1.26; python_version < '3.13'",
    "numpy>=2.3; python_version >= '3.13'",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.2.1",
]
# Parakeet TDT int8 ONNX via ONNX Runtime (feature 008, no torch).
parakeet = [
    # Capped at 1.27.x for sherpa-onnx's VERS_1.27.0 symbol version; sherpa is
    # gone, but lifting the cap moves the runtime the perf baseline measured.
    "onnxruntime>=1.27,<1.28",
]
# FunASR / SenseVoice batch adapter (feature 009): ONNX Runtime + fbank +
# sentencepiece, no torch/NeMo. The single funasr-onnx dep pulls in all
# transitive deps (onnxruntime, kaldi-native-fbank, sentencepiece, numpy,
# PyYAML, jieba, librosa, scipy, soundfile).
funasr = [
    # funasr-onnx caps numpy at 1.26.4, and in a universal lock that cap would
    # pin every interpreter to it (see the numpy note above). It has no
    # interpreter newer than 3.12 to run on anyway; the funasr snap is core24.
    "funasr-onnx>=0.4.2; python_version < '3.13'",
]
benchmarker = [
    "psutil>=5",
    "pyyaml>=6",
]

[project.scripts]
myna-server = "myna.server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pyyaml>=6",   # myna-bench run config
    "psutil>=5",   # myna-bench run peak RSS/VRAM sampling
    # Quality gates (feature 006): patch-coverage gate, lint, scoped types,
    # dead-code scan, scheduled lockfile audit.
    "diff-cover>=9",
    "ruff>=0.8",
    "mypy>=1.13",
    "vulture>=2.14",
    "pip-audit>=2.7",
    # dev/requantize_encoder.py (perf T06): onnxruntime.quantization needs the
    # onnx package to load/rewrite the graph. Pinned here directly so a
    # parakeet-only sync has it. Dev-only -- never imported at runtime.
    "onnx>=1.19",
    "mutmut>=3.8.0",
    # The OpenAI Realtime API conformance oracle (tests/test_openai_realtime_
    # conformance.py): the SDK's pydantic models are generated from OpenAI's
    # published OpenAPI spec, so validating our IE115 frames against them is
    # validating against the spec itself. Dev-only, never imported at runtime.
    "openai>=3.13",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myna"]

# Mutation testing (`make mutate-server MUTATE='myna.core.session*'`). Scoped
# runs only: mutmut copies src/ into mutants/ and runs the offline suite once
# per surviving mutant, so the whole package is hours.
[tool.mutmut]
source_paths = ["src/myna"]
pytest_add_cli_args_test_selection = ["tests"]
# mutmut runs the suite from a copy under mutants/, where the tests marked
# repo_tree (they read snap scripts, dev/ scripts and manifests relative to
# the repository root) find nothing. None of them tests src/ logic. The
# populations test imports its dev/ script at module level, so a marker is
# too late for it (deselection happens after collection): ignore the file.
# The GJS coverage test imports dev/gjs_coverage.py the same way.
pytest_add_cli_args = [
    "-m",
    "not repo_tree",
    "--ignore=tests/test_coverage_populations.py",
    "--ignore=tests/test_gjs_coverage.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "repo_tree: reads the repository outside server/ (excluded under mutmut)",
]

[tool.coverage.run]
source = ["myna"]
branch = true

[tool.vulture]
# The dead-code report is only useful if it is actionable (feature 006, US2
# acceptance 3), so known-good false positives are named here rather than left
# to be re-triaged every run. intra_op_num_threads is a parameter on
# _FakeSessionOptions (test_parakeet.py), which mirrors ORT's real
# SessionOptions signature so a drift in the real one breaks the fake loudly.
# A parameter the fake deliberately ignores is not dead code.
ignore_names = ["intra_op_num_threads"]

[tool.ruff]
src = ["src", "../dev"]
# House width is ~100; default 88 wraps too aggressively for this codebase.
line-length = 100

[tool.ruff.lint]
# F401/F841 (unused imports/names) are the dead-code statics of FR-006;
# E/W/I keep style and import hygiene mechanical (FR-010).
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "E402"]  # importorskip precedes gated imports

[tool.mypy]
# Strict over the whole package. The optional model runtimes ship no types
# and are not installed in the dev environment (they ride the snap extras),
# so their imports are the one thing not checked; everything written here is.
mypy_path = "src"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "ctranslate2.*",
    "faster_whisper.*",
    "funasr_onnx.*",
    "huggingface_hub.*",
    "onnxruntime.*",
    "soundfile.*",
    "tracy_client.*",
]
ignore_missing_imports = true
