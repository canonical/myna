# Myna dictation client snap (UbuSTT) — ships the Rust orchestrator.
#
# This is the mirror image of the inference snaps (whisper/nemotron/qwen):
# under the audio-push invariant *this* snap owns the microphone, the hotkey,
# and text injection; it captures PCM and pushes it to a backend snap's
# session socket. The backend socket is reached over the `backend` content
# share (T14c): the backend snap exports $SNAP_COMMON/run (writable content
# slot `ubustt-socket`), bind-mounted here at $SNAP_DATA/backend.
#
# Deliberately NO `network` plug: dictation is local and offline; every
# boundary is a Unix socket or the session bus (constitution V). `network-bind`
# is the one concession, and it buys no outbound reach: it is the only
# interface carrying seccomp `bind(2)`, which the AF_UNIX control socket needs
# as much as an inet listener would.
#
# Build:  ./dev/prepare.sh && snapcraft pack
name: myna
base: core24
version: 0.1.0-dev
assumes:
  - snapd2.75 # pipewire interface + writable content shares
summary: Speech to text desktop client for the Ubuntu Desktop
description: |
  Local, offline speech-to-text for the Ubuntu desktop. Invoke
  the client, speak and the transcript is typed into the focused
  application via IBus. Audio is captured by this snap (the inference snaps
  have no microphone access) and pushed as PCM to a local backend snap
  over a Unix socket; nothing leaves the machine and no audio is persisted.
grade: devel
confinement: strict
compression: lzo

platforms:
  amd64:

environment:
  # The staged libpipewire must find its SPA plugins inside the snap — its
  # compiled-in default (/usr/lib/…/spa-0.2) resolves against the core24
  # base, which has no spa-0.2 ("can't make support.system handle").
  SPA_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2
  PIPEWIRE_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
  PIPEWIRE_CONFIG_DIR: $SNAP/usr/share/pipewire
  # Client settings live in GSettings (com.canonical.Myna.Dictation), which needs two
  # things the base cannot supply: our own compiled schema, and the dconf
  # backend module. glib comes from core24, so it looks for gio modules in the
  # *base's* /usr/lib/.../gio/modules - empty - rather than the snap's, and
  # without the backend every write would land in a memory backend and be lost
  # at exit. See myna_core::settings.
  GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas
  GIO_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules
  # ...and the *host's* dconf database, which is the point of using GSettings
  # at all: the store has to be the one `gsettings set` and a Settings panel
  # write. libdconf derives that path from XDG_CONFIG_HOME (else $HOME/.config)
  # and snapd points $HOME at $SNAP_USER_DATA, so without this the daemon reads
  # a database nothing writes and every key is its schema default. The
  # `gsettings` interface already grants read on the real one; writes never went
  # through the file anyway (the dconf service performs those over D-Bus).
  # Also the first place myna-desktop looks for the IBus address file, which is
  # under the real home too.
  XDG_CONFIG_HOME: $SNAP_REAL_HOME/.config

apps:
  # The dictation HUD renderer (feature 004): standalone GTK4 + libadwaita
  # application (GPU ribbon, pill chrome, accent/motion/high-contrast, lab).
  # Hosted by the myna-shell extension's overlay on GNOME (R27); also usable
  # standalone via `snap run myna.hud --lab` / `--serve-dbus`. Packaged via
  # the `gnome` extension (core24 → GNOME 46 SDK: GTK 4.18 / libadwaita 1.7).
  # This re-stages the toolkit that T69 had pruned for the one-label ui-gtk
  # overlay — now justified by the real product. The myna snap itself stays
  # 4.9 MB; this is the `gnome` extension's ~13 MB cost.
  hud:
    command: bin/myna-hud
    extensions: [gnome]
    plugs:
      - wayland
      - x11
      - desktop
    slots:
      - hud # com.canonical.Myna.Hud for the HUD's D-Bus service

  # The dictation daemon: hotkey → PipeWire capture → backend → IBus inject.
  # The launcher passes only --socket/--language: activation (portal, because
  # $SNAP is set), the com.canonical.Myna.Dictation indicator, and streaming preedit are
  # all resolved by myna-desktop itself rather than pinned here.
  # NOTE: deliberately NO `gnome` extension for the daemon itself and no GTK
  # at all there. The packaged build omits myna-desktop's removed `ui-gtk`
  # overlay, so feedback is the com.canonical.Myna.Dictation indicator (myna-shell)
  # with a notification fallback: no toolkit to ship there, and none of the
  # GTK stack that came with it.
  myna:
    command: bin/myna-daemon
    # A per-user systemd service, started at login and supervised
    # (`WantedBy=default.target`, `Restart=on-failure`, `RestartSec=1s`).
    # Reachable as `snap services|start|stop|logs myna`.
    #
    # INSTALL PRECONDITION: snapd rejects the *install* of any snap declaring a
    # user daemon unless `experimental.user-daemons` is set or the snap-id is on
    # the hardcoded allowlist in overlord/snapstate/snapstate.go:82 (checked at
    # :561, snapd 2.77). A local or `--dangerous` install has no snap-id at all,
    # so dev and CI need:
    #
    #   sudo snap set system experimental.user-daemons=true
    #
    # The store path is a snapd PR adding this snap's id to that list, which
    # needs the name registered and uploaded first.
    #
    # NOT `activates-on: [dictation]`: that omits the [Install] section
    # entirely (wrappers/internal/service_unit_gen.go:214), making the unit
    # on-demand only. Nothing would hold the global hotkey until something
    # addressed com.canonical.Myna.Dictation, and the only natural poker is the
    # myna-shell extension, which is not packaged. The hotkey IS the entry
    # point, so it has to be held from login.
    #
    # Starting against `default.target` means PAM login - before the
    # compositor, PipeWire, IBus and the portal (the `graphical-session.target`
    # ordering for desktop-plugging user daemons was added in snapd 2.74 and
    # reverted in 2.74.1, LP #2141607). That is safe because myna-desktop
    # treats all four as things that come and go: it binds activation with
    # backoff, connects IBus at the first press, and resolves the backend
    # socket per press.
    daemon: simple
    daemon-scope: user
    # A refresh stops this unit in *every* user manager and starts it again on
    # the new revision - measured, not assumed (2026-08-26: x3 -> x4, new pids
    # in both a graphical session and a lingering headless one). Stated rather
    # than left to the default, because the alternative is a real choice:
    # `endure` keeps an in-flight utterance alive at the price of running the
    # old revision until the user logs out, which on a laptop that only ever
    # suspends is weeks. An utterance lasts seconds, so the window a refresh
    # can land in is tiny and the cost when it does is that one utterance;
    # activation rebinds by itself afterwards. Fixes landing promptly is worth
    # more.
    refresh-mode: restart
    plugs:
      - pipewire # mic capture — snapd gates it: `snap connect myna:pipewire`
      - desktop # portals (GlobalShortcuts hotkey) + desktop notifications
      - desktop-legacy # the IBus daemon's private socket (text injection)
      - gsettings # dconf write for --install-shortcut (control mode)
      - network-bind # seccomp bind(2) for the control socket - no other interface grants it
      - backend # content share → the backend snap's session socket
    slots:
      - dictation # com.canonical.Myna.Dictation for the GNOME Shell indicator

  # Poke the running daemon. Only meaningful under control-socket activation
  # (`myna --control`), which a packaged build does not default to: bind
  # `/snap/bin/myna.toggle` to a shortcut, or run `myna.install-shortcut`.
  toggle:
    command: bin/myna-desktop --toggle

  # Bind <accel> → `myna.toggle` via dconf. Only needed under `myna --control`
  # — packaged, the daemon defaults to the GlobalShortcuts portal, which owns
  # its own binding. Uses dconf because the GNOME schemas are not visible
  # inside the snap's core24 /usr — dconf writes need no schema, and the
  # gsettings interface grants them.
  install-shortcut:
    command: bin/myna-install-shortcut
    plugs:
      - gsettings

  # One screen of "what is dictation doing, and why": the persisted settings,
  # what they resolved to and which plane won, whether the backend socket is
  # reachable, and what the running daemon publishes on the bus. Those four
  # answers lived in four places (gsettings, a journal line printed once at
  # startup, the content share, D-Bus), which is a lot to know before you can
  # ask a simple question.
  #
  # An app rather than a flag on a wrapper the user never sees, and confined
  # rather than unpackaged, because the answer depends on where it is asked
  # from: `$SNAP` decides activation, and the backend share is a bind mount
  # that only exists in this namespace.
  status:
    command: bin/myna-status
    plugs:
      # Two plugs, three capabilities. `gsettings` reads the host's dconf
      # database (see `environment:`) and, because it pulls in AppArmor's
      # dbus-session-strict abstraction, is also what grants the session bus
      # socket; the base template then allows D-Bus to peers in the same snap
      # ("Allow apps from the same package to communicate with each other via
      # DBus"), so reading the daemon's published state needs no `dbus` plug of
      # its own - verified against the generated profile, which contains no
      # rule naming com.canonical.Myna.Dictation at all. `backend` makes the socket line
      # the truth rather than a guess: the content share is a bind mount that
      # exists only in this namespace.
      - gsettings
      - backend

  # The testbed CLI (myna-dictate): device listing, WAV-clip sessions, wire
  # dialect selection. `home` lets it read clips from the user's files.
  testbed:
    command: bin/myna-testbed
    plugs:
      - pipewire
      - home
      - backend

# The backend session socket, shared by an inference snap (whisper /
# nemotron / qwen). Manual connect (different publishers):
#   sudo snap connect myna:backend myna-whisper:ubustt-socket
# snapd appends the slot's source basename, so the socket lands at
# $SNAP_DATA/backend/run/ubustt.sock. One active backend at a time;
# multi-backend discovery/selection is T48.
plugs:
  backend:
    interface: content
    content: ubustt-socket
    target: $SNAP_DATA/backend

slots:
  dictation:
    interface: dbus
    bus: session
    name: com.canonical.Myna.Dictation

  hud:
    interface: dbus
    bus: session
    name: com.canonical.Myna.Hud

parts:
  # Rust toolchain via the rustup snap. The `rust` plugin is unusable here:
  # its prologue env validation runs before any part builds, and with rustup
  # 1.29 both its checks (`rustup dump-testament` with no default toolchain;
  # `cargo --version` in the bare instance) fail before the toolchain it
  # would install exists. A nil part + explicit toolchain is deterministic.
  rust-deps:
    plugin: nil
    build-packages:
      - rustup
    override-pull: |
      rustup default stable

  # The Rust workspace (client/), staged into this project by dev/prepare.sh
  # (craft-parts local sources must live inside the project dir). Builds the
  # shipped app + the testbed CLI.
  client:
    plugin: nil
    after: [rust-deps]
    source: client
    build-packages:
      - curl
      - gcc
      - git
      - pkg-config
      - libclang-dev # bindgen, for pipewire-sys
      - libpipewire-0.3-dev
      - libgtk-4-dev
      - libadwaita-1-dev
      - libepoxy-dev
      - libegl-dev
      - libgl1-mesa-dev
      - gettext # xgettext for myna-hud po template (build-time only)
    override-build: |
      toolchain="$HOME/.rustup/toolchains/stable-$(uname -m)-unknown-linux-gnu"
      export PATH="$toolchain/bin:$PATH"
      cargo install -f --locked --path myna-desktop --root "$CRAFT_PART_INSTALL"
      cargo install -f --locked --path myna-cli --root "$CRAFT_PART_INSTALL"
      cargo install -f --locked --path myna-hud --root "$CRAFT_PART_INSTALL"
      rm -f "$CRAFT_PART_INSTALL"/.crates.toml "$CRAFT_PART_INSTALL"/.crates2.json
      # DWARF is ~30% of a release Rust binary and no user of a strict snap
      # can run a debugger against it anyway. --strip-debug, not --strip-all:
      # the symbol table is what makes a panic backtrace readable.
      strip --strip-debug "$CRAFT_PART_INSTALL"/bin/*
      # The settings store, from the same XML the host and the (future) deb
      # install - one schema, three kinds of writer (myna_core::settings).
      install -Dm644 data/glib-2.0/schemas/com.canonical.Myna.Dictation.gschema.xml \
          "$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas/com.canonical.Myna.Dictation.gschema.xml"
    stage-packages:
      - libpipewire-0.3-0
      # protocol-native & friends: mandatory modules loaded by pw_context_new
      # (PIPEWIRE_MODULE_DIR). libspa-0.2-modules comes in as a dependency.
      - libpipewire-0.3-modules
    prime:
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/lintian
      - -usr/share/bug
      - -usr/share/doc-base
    override-prime: |
      craftctl default
      cd "$CRAFT_PRIME"
      lib="usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"

      # libpipewire-0.3-modules ships ~40 modules; pw_context_new loads the
      # six named in client.conf and nothing dlopens the rest. The keep-list
      # is spelled out here rather than read out of client.conf: that file is
      # primed by another part, with no ordering guarantee between them.
      modules="protocol-native client-node client-device adapter metadata session-manager"
      for so in "$lib"/pipewire-0.3/libpipewire-module-*.so; do
        name=$(basename "$so" .so)
        case " $modules " in
          *" ${name#libpipewire-module-} "*) ;;
          *) rm -f "$so" ;;
        esac
      done

      # Likewise for SPA: client.conf's context.spa-libs maps audioconvert
      # and support and nothing else. Devices (alsa, v4l2, bluez5) are opened
      # by the host daemon, never here: this snap is a PipeWire *client*.
      find "$lib"/spa-0.2 -mindepth 1 -maxdepth 1 -type d \
        ! -name audioconvert ! -name support -exec rm -rf {} +

      # gio's proxy/TLS modules, glib-pacrunner and session-migration would
      # otherwise be honoured as roots by the sweep below, and they are what
      # drags libproxy -> libcurl -> libssh/libldap/libsasl2 into a snap that
      # has no `network` plug at all.
      rm -f "$lib"/gio/modules/libgiolibproxy.so \
            "$lib"/gio/modules/libgiognomeproxy.so \
            "$lib"/gio/modules/libgiognutls.so \
            usr/libexec/glib-pacrunner usr/bin/session-migration

      # Now drop every library the snap cannot reach. Deleting those modules
      # orphans the apt dependencies they came with - roc, pulse, avahi,
      # libcurl and every audio codec - and that list churns with each
      # pipewire release, so walk the ELF closure from the real entry points
      # instead of chasing it by hand. Roots: the shipped binaries, plus the
      # plugin directories, which are dlopened and so have no NEEDED edge
      # pointing at them. Over-pruning is not silent: snapcraft's `library`
      # linter reports anything left with a missing dependency.
       keep=$(mktemp) todo=$(mktemp) next=$(mktemp)
      { ls bin/myna-desktop bin/myna-dictate bin/myna-hud usr/bin/* usr/libexec/* 2>/dev/null
        find "$lib"/pipewire-0.3 "$lib"/spa-0.2 "$lib"/gio -name '*.so' 2>/dev/null
      } > "$todo" || true
      while [ -s "$todo" ]; do
        : > "$next"
        while read -r f; do
          real=$(readlink -f "$f") || continue
          grep -qxF "$real" "$keep" && continue
          echo "$real" >> "$keep"
          objdump -p "$real" 2>/dev/null | awk '/NEEDED/ {print $2}' |
            while read -r n; do find usr/lib -name "$n" >> "$next"; done
        done < "$todo"
        cp "$next" "$todo"
      done
      find usr/lib -name '*.so*' -type f |
        while read -r f; do
          grep -qxF "$(readlink -f "$f")" "$keep" || rm -f "$f"
        done
      find usr/lib -xtype l -delete
      find usr/lib -type d -empty -delete
      rm -f "$keep" "$todo" "$next"

      # Data and unit/service files left behind by the libraries the sweep
      # took out. The systemd user units and the PACRunner D-Bus service are
      # doubly dead: the host never reads a snap's, and they now name
      # binaries this part just deleted.
      rm -rf usr/share/X11 usr/share/alsa usr/share/GConf usr/share/upstart \
             usr/share/session-migration \
             usr/share/bash-completion usr/lib/systemd "$lib"/avahi \
             etc/pulse usr/share/dbus-1/services/org.gtk.GLib.PACRunner.service

      # usr/share/glib-2.0 survives that sweep for exactly one file, the
      # settings schema. Everything a stage-package left beside it goes, and
      # what remains is compiled: glib reads gschemas.compiled, never the XML.
      find usr/share/glib-2.0 -type f ! -name 'com.canonical.Myna*.gschema.xml' -delete
      find usr/share/glib-2.0 -mindepth 1 -type d -empty -delete
      glib-compile-schemas usr/share/glib-2.0/schemas

  # PipeWire client config (client.conf & friends). In noble these ship in
  # pipewire-bin (libpipewire-0.3-common is docs-only); pw_context_new treats
  # a missing client.conf as fatal. Keep ONLY client.conf: not the daemon
  # binaries the package also carries, nor the daemon/JACK/AES67/AVB configs
  # sitting beside it.
  pipewire-config:
    plugin: nil
    stage-packages:
      - pipewire-bin
    # Filter at *stage*, not prime: pipewire-bin's dependency tree overlaps
    # the client part's (libcurl-gnutls & co.) and craft-parts refuses to
    # stage the same path from two parts. Nothing here is wanted anyway.
    stage:
      - usr/share/pipewire/client.conf

  scripts:
    plugin: dump
    source: scripts
    stage-packages:
      - dconf-cli # dconf write, for myna-install-shortcut
    prime:
      - -usr/share/doc
      - -usr/share/man
    organize:
      "myna-daemon": bin/myna-daemon
      "myna-status": bin/myna-status
      "myna-testbed": bin/myna-testbed
      "myna-install-shortcut": bin/myna-install-shortcut
      "myna-runtime-links": bin/myna-runtime-links
