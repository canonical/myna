# Realtime scheduling for the PipeWire data thread, which is where capture's
# process callback runs (RT_PROCESS). core24 ships PipeWire 1.0.5, whose
# client.conf loads no module-rt: upstream kept it in client-rt.conf until the
# two were merged in 1.2.
#
# Args are upstream's defaults: rt.prio 83, and RLIMIT_RTPRIO first, then the
# xdg Realtime portal (`desktop`), then RTKit. nice.level is left alone - its
# default is a no-op, and the snap seccomp template allows setpriority only
# down to 0 anyway.
context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
]
