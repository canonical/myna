# faster-whisper (CTranslate2) on CPU, serving the UbuSTT session API.
# The CPU venv is baked into the base snap (server-app part); model weights
# ship as per-model components (T15), so no runtime download / network access.
servers:
  ubustt:
    protocol: ws+unix
    base-path: /v1

environment: []

components: []
