name: large-v3-turbo
description: Whisper large-v3-turbo (809M params) - near-large accuracy at ~4x the speed, GPU-tier weights
model-card-url: https://huggingface.co/dropbox-dash/faster-whisper-large-v3-turbo
format: CTranslate2
quantization: float16
capabilities:
  - realtime-transcription
disk-size: 1.7G
components:
  - model-large-v3-turbo
environment:
  - MODEL_DIR=$SNAP_COMPONENTS/model-large-v3-turbo
  # Runtime compute policy; the packaged artifact above remains float16.
  # Measured 2026-10-01 on corpus/english/manifest-balanced.json (RTX 4080
  # Laptop, nvidia-gpu engine): streaming fp16 2.61% WER @ 12x, 2.4G VRAM;
  # int8_float16 2.54% @ 14x, 1.4G VRAM - a small but consistent int8 edge
  # on every axis; fp16 keeps the default pending a repeated run with
  # confidence intervals.
  - MODEL_COMPUTE_TYPE=float16
  # Batch decode policy (the streaming path is unaffected). With the default
  # conditioning this model enters repetition loops in batch mode - 80.6%
  # WER on the 5min long-form clip. Bench-verified 2026-10-01 through the
  # packaged snap: batch 2.11-2.23% pooled and 1.4-1.9% long-form (was
  # 18.6-23.4% and 62.7-80.6%) - the best rows of the sweep. Rationale lives
  # in batch_decode_options (server/src/myna/testbed/whisper.py).
  - MODEL_BATCH_CONDITION_ON_PREVIOUS_TEXT=false
  - MODEL_BATCH_VAD_FILTER=true
