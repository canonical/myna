name: small
description: Whisper small (244M params) — best accuracy of the CPU options
model-card-url: https://huggingface.co/Systran/faster-whisper-small
quantization: float32
disk-size: 500M
components:
  - model-small
environment:
  - MODEL_DIR=$SNAP_COMPONENTS/model-small
  # Measured 2026-08-26 on corpus/real/manifest-balanced.json:
  # See base. Re-measure before changing.
  - MODEL_COMPUTE_TYPE=float32
