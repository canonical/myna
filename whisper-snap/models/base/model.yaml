name: base
description: Whisper base (74M params) — balanced speed and accuracy on CPU
model-card-url: https://huggingface.co/Systran/faster-whisper-base
quantization: float32
disk-size: 150M
components:
  - model-base
environment:
  - MODEL_DIR=$SNAP_COMPONENTS/model-base
  # Measured 2026-08-26 on corpus/english/manifest-balanced.json:
  # INT8 costs 4.53% -> 5.03% WER for 1.37x. `base` is
  # the accuracy option; not a trade to make by default.
  - MODEL_COMPUTE_TYPE=float32
