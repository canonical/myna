# Follows the gemma4-snap pattern (engine/runtime/model manifests + modelctl
# v2 from inference-snaps-cli). Differences from the LLM snaps:
#   - the server is the Myna session server (myna-server) on a Unix socket,
#     not an HTTP llama-server: no microphone access, no TCP port.
#   - model weights ship as per-model snap components (T15): run
#     ./dev/download-models.sh before packing. No runtime download / `network`.
#   - cpu engine venv is baked into the base snap (server-app part); the
#     nvidia-gpu CUDA stack ships as the gpu-nvidia component.
name: myna-whisper
base: core24
adopt-info: version
assumes:
  - snapd2.68 # components support
license: AGPL-3.0-or-later
summary: Whisper speech-to-text inference snap for Myna
description: |
  Local, offline speech-to-text service exposing the Myna session API on a
  Unix domain socket. Wraps Whisper models served via faster-whisper
  (CTranslate2), with hardware-based engine selection and switchable model
  sizes via the modelctl CLI.

  The service receives PCM audio pushed by clients; it has no access to the
  microphone or any audio hardware.
grade: devel
confinement: strict
compression: lzo

platforms:
  amd64:
  arm64:

environment:
  # Path modelctl/runtimes use to reach installed components, matching the
  # reference snaps. Model components expose MODEL_DIR=$SNAP_COMPONENTS/<id>.
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR

apps:
  whisper:
    command: bin/whisper
    completer: bin/snap-completer.bash
    plugs:
      # modelctl's hardware detection (lscompute reading /sys, /proc) backs
      # `use-engine --auto`, `show-engine` and `status`.
      - hardware-observe
      - opengl

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      - hardware-observe
      - opengl
      # Weights are components now (no runtime download), so no `network`.
      - network-bind # snapd seccomp gates listen() behind this, even for Unix sockets

hooks:
  install:
    plugs: &hook-plugs
      - hardware-observe
      - opengl
      # The driver check before engine selection (myna.server.cuda_probe):
      # cuInit listen()s on a socket, which seccomp allows only with this
      # plug, and fails with CUDA error 304 without it.
      - network-bind
  post-refresh:
    plugs: *hook-plugs
  connect-plug-hardware-observe:
    plugs: *hook-plugs

# The inference-provider content share. Consumers (the myna snap's `backend`
# plug) find this snap by the provider.env that `myna-server --share-provider`
# writes here, naming the snap and the socket beside it. Writable, not read:
# snapd then adds AppArmor rw rules on the directory, which a named-socket
# connect() through the bind mount needs (interfaces/builtin/content.go). Both
# files appear once the server daemon has run. Identity-based access control
# beyond "an admin connected the plug" remains T17.
slots:
  provider:
    interface: content
    content: inference-provider
    source:
      write: [$SNAP_COMMON/share/provider]

parts:
  # The version dev/stage-version.sh resolved from git, from dev/prepare.sh.
  version:
    plugin: nil
    source: version
    parse-info: [version.metainfo.xml]

  # LICENSE (AGPL-3.0-or-later) and NOTICE (third-party notices), staged into
  # licenses/ by dev/stage-licenses.sh from dev/prepare.sh.
  licenses:
    plugin: dump
    source: licenses
    organize:
      "*": usr/share/doc/myna-whisper/

  cli:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.14/inference-snaps-cli-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.14/inference-snaps-cli-linux-arm64.tar.xz
    override-build: |
      # Named symlink so cobra picks up the snap command name.
      # The tarball ships bin/modelctl + bin/snap-completer.bash.
      ln --symbolic ./modelctl bin/whisper
      craftctl default

  server-app:
    # myna-server + faster-whisper in a venv. The myna wheel is staged into
    # wheels/ by dev/prepare.sh before packing.
    plugin: python
    # Persistent pip cache: the build VM is thrown away each run, but the
    # project dir is bind-mounted, so this survives. Not find-links, which
    # loses to the index whenever the version ties.
    build-environment:
      - PIP_CACHE_DIR: $CRAFT_PROJECT_DIR/.pip-cache
      # pip's 15s default read timeout trips on a stalled chunk mid-wheel,
      # and its retries do not cover a mid-stream read.
      - PIP_TIMEOUT: "60"
      - PIP_RETRIES: "10"
    source: wheels
    python-packages:
      - ./myna-0.0.0-py3-none-any.whl[whisper]
    build-packages:
      - python3-venv
    override-build: |
      craftctl default
      site=$(echo "$CRAFT_PART_INSTALL"/lib/python3.*/site-packages)
      # faster-whisper declares onnxruntime (and so protobuf/flatbuffers) only
      # to run the bundled Silero VAD, lazily from vad.py. The cpu engine's
      # models (tiny/base/small) all ship the default batch policy, which
      # keeps vad_filter off; the large models that turn it on are GPU-only
      # and find onnxruntime in the gpu-nvidia component instead. The gate
      # pins the default policy: if it ever flipped, this pruned venv would
      # crash on the first batch decode.
      export PRUNE_DROP="onnxruntime google protobuf flatbuffers"
      export PRUNE_GATE="from myna.testbed.whisper import batch_decode_options as b; assert b('en', None)['vad_filter'] is False, 'cpu engine prunes onnxruntime; a vad-by-default batch policy needs it'"
      "$CRAFT_PROJECT_DIR/dev/prune-runtime.sh" "$site" "$CRAFT_PART_INSTALL/bin/python3"
      rm -f "$CRAFT_PART_INSTALL"/bin/onnxruntime_test "$CRAFT_PART_INSTALL"/bin/pip*

  engines:
    plugin: dump
    source: engines
    organize:
      "*": engines/

  runtimes:
    plugin: dump
    source: runtimes
    organize:
      "*": runtimes/

  models:
    plugin: dump
    source: models
    organize:
      "*": models/

  scripts:
    plugin: dump
    source: scripts
    stage-packages:
      - jq
    organize:
      "server.sh": bin/

  # modelctl reads the GPU's compute capability through nvidia-smi, and an
  # engine whose compute-capability it cannot read does not match. Only the
  # binary: its NVML library is the host driver's, through opengl.
  nvidia-smi:
    plugin: nil
    build-packages:
      - nvidia-utils-580
    override-build: |
      install -D /usr/bin/nvidia-smi "$CRAFT_PART_INSTALL/usr/bin/nvidia-smi"
      install -D --mode=644 /usr/share/doc/nvidia-utils-580/copyright \
          "$CRAFT_PART_INSTALL/usr/share/doc/nvidia-utils-580/copyright"

  # Model weights as components. Populate components/ with
  # ./dev/download-models.sh before packing. Each model-<size>-ct2/ directory
  # (CTranslate2 conversion: model.bin, config.json, tokenizer.json, …) is
  # routed into its own component; `prime: [-*]` keeps them out of the base.
  model-components:
    plugin: dump
    source: components
    organize:
      "model-tiny-ct2/*": (component/model-tiny)/
      "model-base-ct2/*": (component/model-base)/
      "model-small-ct2/*": (component/model-small)/
      "model-large-v3-ct2/*": (component/model-large-v3)/
      "model-large-v3-turbo-ct2/*": (component/model-large-v3-turbo)/
    prime:
      - -*

  # CUDA runtime as a component: myna[whisper] + ctranslate2 + NVIDIA cuBLAS/
  # cuDNN pip libs under site-packages/. Exposed via PYTHONPATH + LD_LIBRARY_PATH
  # (see runtimes/faster-whisper-cuda/runtime.yaml), run by the base python3.
  # amd64-only.
  # What the base venv lacks for the GPU engine (runtimes/faster-whisper-cuda/
  # requirements.txt), first on PYTHONPATH; myna, faster-whisper and
  # ctranslate2 come from the base, so a server fix never changes this
  # component.
  faster-whisper-cuda:
    plugin: nil
    after: [server-app]
    # Persistent pip cache: the build VM is thrown away each run, but the
    # project dir is bind-mounted, so this survives. Not find-links, which
    # loses to the index whenever the version ties.
    build-environment:
      - PIP_CACHE_DIR: $CRAFT_PROJECT_DIR/.pip-cache
      # pip's 15s default read timeout trips on a stalled chunk mid-wheel,
      # and its retries do not cover a mid-stream read.
      - PIP_TIMEOUT: "60"
      - PIP_RETRIES: "10"
    source: wheels
    build-packages:
      - python3
      - python3-pip
    override-build: |
      [ "$CRAFT_ARCH_BUILD_FOR" = amd64 ] || exit 0
      target="$CRAFT_PART_INSTALL/site-packages"
      mkdir -p "$target"
      # No nvidia-cudnn-cu12: CTranslate2 4.8's CUDA backend is cuBLAS-only.
      # It carries no DT_NEEDED, no dlopen name and not one "cudnn" string,
      # and the wheel declares no CUDA deps at all. cuBLAS pulls NVRTC itself.
      pip3 install --target="$target" --no-deps \
        --requirement "$CRAFT_PROJECT_DIR/runtimes/faster-whisper-cuda/requirements.txt"
      # onnxruntime is here for the large models' batch policy, which sets
      # vad_filter (models/*/model.yaml MODEL_BATCH_VAD_FILTER): faster-whisper
      # runs its bundled Silero VAD on onnxruntime, lazily from vad.py. The gate
      # imports as the engine does, this component then the base, and loads
      # that model - the exact lazy path a vad batch decode hits on first use -
      # so a pruned-too-far build fails here, not on dictation.
      export PRUNE_DROP=""
      export PRUNE_GATE="import os, myna, onnxruntime; from faster_whisper.vad import get_vad_model; get_vad_model(); assert onnxruntime.__file__.startswith('$target' + os.sep); assert not myna.__file__.startswith('$target' + os.sep)"
      PYTHONPATH="$(echo "$CRAFT_STAGE"/lib/python3.*/site-packages)" \
        "$CRAFT_PROJECT_DIR/dev/prune-runtime.sh" "$target" python3
      nvidia="$target/nvidia"
      # The .alt NVRTC is a second codegen build nothing here dlopens - the
      # only binary naming it is itself. libnvrtc.so.12 stays; cuBLASLt JITs
      # through it, and it wants the matching non-alt builtins.
      rm -f "$nvidia"/cuda_nvrtc/lib/libnvrtc.alt.so.* \
            "$nvidia"/cuda_nvrtc/lib/libnvrtc-builtins.alt.so.*
      # A LD_PRELOAD BLAS interposer for unmodified Fortran binaries, and
      # headers for compiling against the stack. Neither has a runtime caller.
      rm -f "$nvidia"/cublas/lib/libnvblas.so.*
      rm -rf "$nvidia"/*/include "$target"/bin
      craftctl default
    organize:
      "*": (component/gpu-nvidia)
    prime:
      - -*

components:
  model-tiny:
    type: standard
    summary: Whisper tiny CTranslate2 weights
    description: faster-whisper (CTranslate2) conversion of Whisper tiny (MIT).
  model-base:
    type: standard
    summary: Whisper base CTranslate2 weights
    description: faster-whisper (CTranslate2) conversion of Whisper base (MIT).
  model-small:
    type: standard
    summary: Whisper small CTranslate2 weights
    description: faster-whisper (CTranslate2) conversion of Whisper small (MIT).
  model-large-v3:
    type: standard
    summary: Whisper large-v3 CTranslate2 weights
    description: faster-whisper (CTranslate2) conversion of Whisper large-v3 (MIT).
  model-large-v3-turbo:
    type: standard
    summary: Whisper large-v3-turbo CTranslate2 weights
    description: faster-whisper (CTranslate2) conversion of Whisper large-v3-turbo (MIT).
  gpu-nvidia:
    type: standard
    summary: NVIDIA GPU runtime (faster-whisper on CUDA CTranslate2 + cuBLAS)
    description: |
      GPU inference stack for the nvidia-gpu engine: myna + CUDA CTranslate2
      and the NVIDIA cuBLAS/cuDNN libraries. amd64 only.
