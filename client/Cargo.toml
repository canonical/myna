[workspace]
resolver = "2"
members = ["myna-core", "myna-platform", "myna-audio", "myna-orchestrator", "myna-cli", "myna-desktop", "myna-hud", "myna-config"]

[workspace.package]
# Not the release version: the binaries report dev/version.sh's.
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Corpus clip digests (myna-cli --corpus): the manifest records a sha256 per
# clip and a corpus id over them.
sha2 = "0.10"
# myna-cli --clip: resamples a WAV to the backend's rate, which the daemon gets
# from PipeWire instead.
rubato = "1"
audioadapter-buffers = "2"
bytes = "1"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "io-util", "io-std", "time", "process"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
async-trait = "0.1"
# Native PipeWire bindings (feature 002-native-pipewire-backend). Binds system
# libpipewire-0.3; the -sys crate needs libclang for bindgen at build time.
# v0_3_44 enables PW_KEY_TARGET_OBJECT for node selection by name.
pipewire = { version = "0.10", features = ["v0_3_44"] }
# GSettings, for the client settings store (`myna_core::Settings`). Binds the
# system glib/gio via pkg-config, which is why libglib2.0-dev is a build
# dependency everywhere the workspace is built. Kept at the gtk-rs release the
# GTK4 crates pin, so there is one glib in the tree. That release is 0.21
# (gtk4 0.10, libadwaita 0.8), not 0.22: 0.22 needs Rust 1.92 and the
# myna-config deb builds on noble, whose newest toolchain is rustc-1.91.
gio = "0.21"
