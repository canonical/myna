[package]
name = "myna-hud"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GTK4 renderer application for the myna dictation indicator — the HUD pill and GPU wave ribbon (feature 004, 2026-08-26 architecture revision)."

[lib]
name = "myna_hud"
path = "src/lib.rs"

[[bin]]
name = "myna-hud"
path = "src/main.rs"

[dependencies]
# The pure logic modules (states/vumeter/ribbon/shader/hud_logic/
# input_region/accent/motion/simulator) are std-only; the application half
# links the toolkit stack.
#
# Version strategy (R26; runtime matrix per the snap's SDK — the packaged
# binary builds and runs against ubuntu/gnome-sdk's gnome-46-2404 stack,
# NOT the noble archive):
#   - The myna snap (T160; snapcraft `gnome` extension on core24): GTK
#     4.18.6, libadwaita 1.7.7 — Ubuntu-patched to expose the Yaru accent
#     colors (extra AdwAccentColor values and accent-color-rgba).
#   - Dev/host desktops (26.04+, Shell 50/51): GTK 4.22, libadwaita 1.9+.
#   - Workshop / client CI (.workshop/myna.yaml, ubuntu@26.04): GTK 4.22,
#     libadwaita 1.9. The base was raised from 24.04 for this crate: core24's
#     libadwaita 1.5 is NOT what the snap ships against, so building against
#     it modelled a stack that no user ever runs.
#
# The compile-time features below therefore define the FLOOR we may use, and
# the workshop only has to be at least that:
#   - libadwaita v1_6 — the floor is set by the snap's 1.7.7, and 1.6 is where
#     the accent API landed, so adw_style_manager_get_accent_color_rgba() is
#     called directly rather than probed by property name. NOT v1_7: nothing
#     needed from it, and a floor is easier to hold than to lower.
#   - gtk4 v4_10 only. GTK canNOT follow: the snap is on 4.18, so
#     `gtk-interface-reduced-motion` (4.22) stays a RUNTIME property lookup
#     (find_property + property_value), absent in the snap — where the
#     enable-animations GSettings fallback is the shipping path — and present
#     on 26.04 hosts. v4_10 also matches myna-desktop's former ui-gtk feature
#     for workspace feature unification.
#
# The accent RGBA is still read as a gdk::RGBA and never as AdwAccentColor:
# Ubuntu's Yaru patches add ADW_ACCENT_COLOR_BROWN = SLATE + 100, outside
# upstream's enumeration, so the Rust enum cannot represent it.
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
# The org.myna.Dictation consumer (name watch + PropertiesChanged) and the
# --serve-dbus simulator's publisher. Same crate family as myna-desktop.
zbus = "5"
# The bus worker -> GTK main-thread bridge (T124): glib's own channel is
# deprecated, and this is executor-agnostic.
async-channel = "2"
# Raw GL for the GLArea shader wrapper (dual-profile gl120/es300 compile,
# uniform upload) — loaded via GDK's get_proc_address (R23).
gl = "0.14"
# Status-string localization, domain `myna` (R25). gettext-system: link the
# platform's gettext (glibc provides the runtime symbols) instead of
# building the vendored gnu gettext, which does not build cleanly in
# minimal containers. With no bound domain gettext is the identity
# function, so pure-module tests assert English.
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gdk4-x11 = "0.11"
async-io = "2"

# cargo-machete false-positive: gettext-rs is used in src/main.rs (the
# `gettextrs::TextDomain` binding for R25 localization), but machete does not
# trace it through the gettext-system feature's platform gettext linkage.
[package.metadata.cargo-machete]
ignored = ["gettext-rs"]
