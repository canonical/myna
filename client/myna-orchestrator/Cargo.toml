[package]
name = "myna-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Session + model-residency FSM for the myna dictation orchestrator (plan T40)."

[dependencies]
myna-core = { path = "../myna-core" }
serde_json.workspace = true
bytes.workspace = true
base64.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
async-trait.workspace = true
# User-visible strings (backend error templates) are translatable in this
# crate's own gettext domain; system gettext keeps the minimal build working.
gettext-rs = { version = "0.7", features = ["gettext-system"] }

# cargo-machete cannot see gettext-rs: it is only referenced through the
# re-exported `gettextrs::` namespace (i18n.rs), which the unused-dep scan
# treats as no usage.
[package.metadata.cargo-machete]
ignored = ["gettext-rs"]

[dev-dependencies]
# The real adapter crate, used only to prove it drops in behind the same
# AudioSource trait the WavFileSource mock implements (T50 acceptance).
myna-audio = { path = "../myna-audio" }
