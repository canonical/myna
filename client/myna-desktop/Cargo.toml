[package]
name = "myna-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop session controller + text injection — the dictation last-mile (plan T21/T22, feature 003-desktop-injection)."

[lib]
name = "myna_desktop"
path = "src/lib.rs"

[[bin]]
name = "myna-desktop"
path = "src/bin/myna-desktop.rs"

[features]
# The GTK4 activity-indicator overlay. Opt-in: it drags the whole GTK stack
# (~13 MB packaged) in for one label window, and the myna-shell extension is
# the real indicator on GNOME. Build with `--features ui-gtk` to get it.
default = []
ui-gtk = ["dep:gtk4", "dep:glib", "dep:async-channel"]

[dependencies]
myna-core = { path = "../myna-core" }
myna-audio = { path = "../myna-audio" }
myna-orchestrator = { path = "../myna-orchestrator" }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
# D-Bus: the IBus engine object + a portal-client fallback (pure Rust).
zbus = "5"
# Ergonomic XDG-portal client for GlobalShortcuts. Network build dep; the
# vendored `zbus`-direct path is the fallback if this cannot be fetched.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
# Desktop notifications for error states / secure-field refusals.
notify-rust = "4"
# GTK4 overlay — only pulled in with the `ui-gtk` feature (see [features]).
gtk4 = { version = "0.11", optional = true, features = ["v4_10"] }
glib = { version = "0.22", optional = true }
# Channel bridging the tokio controller to the GTK main-thread indicator loop.
async-channel = { version = "2", optional = true }

[dev-dependencies]
# `#[tokio::test(start_paused = true)]`: the retry backoff is measured in tens
# of seconds, so the tests advance tokio's clock instead of the wall clock.
tokio = { workspace = true, features = ["test-util"] }
