# Nemotron inference snap (Myna).
#
# NVIDIA's cache-aware streaming transducers via onnxruntime, no torch: the
# English model and the 3.5 multilingual one, each a model component, on one
# cpu engine. The server is myna-server --adapter nemotron, which always
# streams: each 0.56 s chunk is decoded once and its words commit at once.
# Weights ship as components: run ./dev/download-models.sh before packing.
# No `network` plug.
name: myna-nemotron
base: core24
adopt-info: version
assumes:
  - snapd2.68 # components support
license: AGPL-3.0-or-later
summary: Nemotron streaming speech-to-text inference snap (Myna)
description: |
  Local, offline speech-to-text service exposing the Myna session API on a
  Unix domain socket. Wraps NVIDIA's Nemotron cache-aware streaming models
  (English, and 3.5 multilingual) as int8 ONNX served via onnxruntime: every
  word is committed about half a second after it is spoken and never revised,
  which suits live captions.

  The service receives PCM audio pushed by clients; it has no access to the
  microphone or any audio hardware.
grade: devel
confinement: strict
compression: lzo

platforms:
  amd64:
  arm64:

environment:
  # Path modelctl/runtimes use to reach installed components.
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR

apps:
  nemotron:
    command: bin/nemotron
    completer: bin/snap-completer.bash
    plugs:
      - hardware-observe
      - opengl

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      # No `process-control`: it exists only to lift seccomp's
      # sched_setaffinity filter so ORT can pin its thread pool, and ORT pins
      # only when it sizes that pool itself. This adapter caps the pool
      # explicitly (two encoder threads: captions run for hours beside
      # everything else), so nothing
      # here ever pins and the plug would be a broad grant
      # (kill/setscheduler/cgroup writes) that does nothing.
      - opengl
      # Weights are a component (no runtime download), so no `network`.
      - network-bind # snapd seccomp gates listen() behind this, even for Unix sockets

hooks:
  install:
    plugs: &hook-plugs
      - hardware-observe
      - opengl
  post-refresh:
    plugs: *hook-plugs

# The inference-provider content share: myna-server writes provider.env beside
# the socket. Writable so connect() works; see whisper-snap's snapcraft.yaml.
slots:
  provider:
    interface: content
    content: inference-provider
    source:
      write: [$SNAP_COMMON/share/provider]

parts:
  # The version dev/stage-version.sh resolved from git, from dev/prepare.sh.
  version:
    plugin: nil
    source: version
    parse-info: [version.metainfo.xml]

  # LICENSE (AGPL-3.0-or-later) and NOTICE (third-party notices), staged into
  # licenses/ by dev/stage-licenses.sh from dev/prepare.sh.
  licenses:
    plugin: dump
    source: licenses
    organize:
      "*": usr/share/doc/myna-nemotron/

  cli:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.14/inference-snaps-cli-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.14/inference-snaps-cli-linux-arm64.tar.xz
    override-build: |
      # Named symlink so cobra picks up the snap command name.
      # The tarball ships bin/modelctl + bin/snap-completer.bash.
      ln --symbolic ./modelctl bin/nemotron
      craftctl default

  server-app:
    # myna-server + onnxruntime in a venv. The myna wheel is staged into
    # wheels/ by dev/prepare.sh before packing.
    plugin: python
    # Persistent pip cache: the build VM is thrown away each run, but the
    # project dir is bind-mounted, so this survives. Not find-links, which
    # loses to the index whenever the version ties.
    build-environment:
      - PIP_CACHE_DIR: $CRAFT_PROJECT_DIR/.pip-cache
      # pip's 15s default read timeout trips on a stalled chunk mid-wheel,
      # and its retries do not cover a mid-stream read.
      - PIP_TIMEOUT: "60"
      - PIP_RETRIES: "10"
    source: wheels
    python-packages:
      - ./myna-0.0.0-py3-none-any.whl[nemotron]
    build-packages:
      - python3-venv
    override-build: |
      craftctl default
      site=$(echo "$CRAFT_PART_INSTALL"/lib/python3.*/site-packages)
      # onnxruntime itself stays - it is this snap's whole runtime. Only its
      # build-time tooling and numpy's test suite go.
      export PRUNE_GATE="import onnxruntime, numpy; assert onnxruntime.InferenceSession"
      "$CRAFT_PROJECT_DIR/dev/prune-runtime.sh" "$site" "$CRAFT_PART_INSTALL/bin/python3"
      rm -f "$CRAFT_PART_INSTALL"/bin/pip* "$CRAFT_PART_INSTALL"/bin/onnxruntime_test

  engines:
    plugin: dump
    source: engines
    organize:
      "*": engines/

  runtimes:
    plugin: dump
    source: runtimes
    organize:
      "*": runtimes/

  models:
    plugin: dump
    source: models
    organize:
      "*": models/

  scripts:
    plugin: dump
    source: scripts
    stage-packages:
      - jq
    organize:
      "server.sh": bin/

  # Model weights as components. Populate components/ with
  # dev/download-models.sh before packing.
  model-components:
    plugin: dump
    source: components
    organize:
      "model-nemotron-en/*": (component/model-nemotron-en)/
      "model-nemotron-3-5/*": (component/model-nemotron-3-5)/
    prime:
      - -*

components:
  model-nemotron-en:
    type: standard
    summary: Nemotron Speech Streaming 0.6B English, int8 ONNX
    description: |
      NVIDIA's cache-aware streaming English transducer with punctuation and
      capitalisation, exported to int8 ONNX (NVIDIA Open Model License).
  model-nemotron-3-5:
    type: standard
    summary: Nemotron 3.5 ASR Streaming 0.6B multilingual, int8 ONNX
    description: |
      NVIDIA's cache-aware streaming multilingual transducer with punctuation
      and capitalisation and a per-session language prompt, exported to int8
      ONNX (OpenMDW-1.1).
