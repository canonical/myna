name: streaming-multi
description: FastConformer hybrid large, cache-aware streaming, English
model-card-url: https://huggingface.co/nvidia/stt_en_fastconformer_hybrid_large_streaming_multi
quantization: fp32
disk-size: 600M
# Weights shipped as a snap component: the .nemo checkpoint downloaded by
# dev/download-models.sh. The adapter restores it directly (no network).
components:
  - model-streaming-multi
environment:
  - MODEL_PATH=$SNAP_COMPONENTS/model-streaming-multi/stt_en_fastconformer_hybrid_large_streaming_multi.nemo
