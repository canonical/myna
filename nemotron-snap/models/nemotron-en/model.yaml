name: nemotron-en
description: Nemotron Speech Streaming 0.6B (English, punctuation) — cache-aware streaming, int8 ONNX
model-card-url: https://huggingface.co/nvidia/nemotron-speech-streaming-en-0.6b
quantization: int8
capabilities:
  - realtime-transcription
disk-size: 900M
# Weights shipped as a snap component, exported from NVIDIA's checkpoint by
# dev/nemotron/export_nemotron_onnx.py. modelctl installs it on use-model; the
# server loads from MODEL_DIR, so no network access is needed.
components:
  - model-nemotron-en
environment:
  - MODEL_DIR=$SNAP_COMPONENTS/model-nemotron-en
