name: cpu
summary: Parakeet TDT int8 via onnxruntime on CPU
description: |
  Runs Parakeet TDT 0.6B v3 (int8 ONNX) with onnxruntime on amd64 CPUs,
  streaming chunked-commit transcription over the UbuSTT Unix-socket
  session API.
vendor: Canonical Ltd

devices:
  anyof:
    - type: cpu
      architecture: amd64

runtime: onnxruntime-cpu

model:
  default: parakeet-tdt-0.6b-v3
  options:
    - parakeet-tdt-0.6b-v3
