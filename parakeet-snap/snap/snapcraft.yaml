# Parakeet inference snap (Myna) - feature 008 US3.
#
# Parakeet TDT 0.6B v3 via onnxruntime, no torch. Two engines, the whisper-snap
# pattern (modelctl v2 + engine/runtime/model manifests + components):
#   - cpu: the int8 export, onnxruntime baked into the base snap.
#   - nvidia-gpu: a fp32 export of NVIDIA's checkpoint on onnxruntime's CUDA
#     provider, the CUDA runtime as a component.
#
# The server is myna-server --adapter parakeet --streaming (chunked commit,
# SilenceCut): the streaming-class UX is this snap's reason to exist. Weights
# ship as a component: run ./dev/download-models.sh before packing. No
# `network` plug.
name: myna-parakeet
base: core24
version: 0.1.0-dev
assumes:
  - snapd2.68 # components support
license: AGPL-3.0-or-later
summary: Parakeet TDT speech-to-text inference snap (Myna)
description: |
  Local, offline speech-to-text service exposing the Myna session API on a
  Unix domain socket. Wraps NVIDIA's Parakeet TDT 0.6B v3 (25 languages,
  punctuation) as ONNX served via onnxruntime, int8 on CPUs and fp32 on
  NVIDIA GPUs, with chunked progressive commit (pause-delimited chunks
  decoded once and committed while the user keeps speaking).

  The service receives PCM audio pushed by clients; it has no access to the
  microphone or any audio hardware.
grade: devel
confinement: strict
compression: lzo

platforms:
  amd64:

environment:
  # Path modelctl/runtimes use to reach installed components, matching the
  # reference snaps. Model components expose MODEL_DIR=$SNAP_COMPONENTS/<id>.
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR

apps:
  parakeet:
    command: bin/parakeet
    completer: bin/snap-completer.bash
    plugs: &hook-plugs
      # modelctl's hardware detection (lscompute reading /sys) backs
      # `show-engine`, `use-engine --auto` and `status`.
      - hardware-observe
      - opengl

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      # Weights are a component (no runtime download), so no `network`.
      - network-bind # snapd seccomp gates listen() behind this, even for Unix sockets
      # ONNX Runtime reads /sys/devices/system/cpu/** for core topology and
      # /sys/fs/cgroup/** for cpuset/quota info to size its thread pool.
      # hardware-observe covers /sys/devices/**; system-observe adds
      # /sys/fs/cgroup/** and /proc/**.
      - hardware-observe
      - system-observe
      # The NVIDIA device nodes and the host driver's libcuda.so.1, for the
      # nvidia-gpu engine.
      - opengl
      # No `process-control` here, unlike the other ORT snaps: it exists only
      # to lift seccomp's sched_setaffinity filter so ORT can pin its thread
      # pool, and ORT pins only when it sizes that pool itself. This adapter
      # sizes all three sessions explicitly (1/4/1 - worth ~2x on short
      # windows, T09), which makes ORT skip affinity entirely, so the plug
      # would be a broad grant (kill/setscheduler/cgroup writes) that does
      # nothing. Verified 2026-09-03: the real adapter loading the shipped
      # weights issues zero sched_setaffinity calls.

hooks:
  install:
    plugs: *hook-plugs
  post-refresh:
    plugs: *hook-plugs
  connect-plug-hardware-observe:
    plugs: *hook-plugs

# The inference-provider content share: myna-server writes provider.env beside
# the socket. Writable so connect() works; see whisper-snap's snapcraft.yaml.
slots:
  provider:
    interface: content
    content: inference-provider
    source:
      write: [$SNAP_COMMON/share/provider]

parts:
  # LICENSE (AGPL-3.0-or-later) and NOTICE (model attribution), staged into
  # licenses/ by dev/stage-licenses.sh from dev/prepare.sh.
  licenses:
    plugin: dump
    source: licenses
    organize:
      "*": usr/share/doc/myna-parakeet/

  cli:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.14/inference-snaps-cli-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.14/inference-snaps-cli-linux-arm64.tar.xz
    override-build: |
      # Named symlink so cobra picks up the snap command name.
      # The tarball ships bin/modelctl + bin/snap-completer.bash.
      ln --symbolic ./modelctl bin/parakeet
      craftctl default

  server-app:
    # myna-server + onnxruntime in a venv. The myna wheel is staged into
    # wheels/ by dev/prepare.sh before packing.
    plugin: python
    # Persistent pip cache: the build VM is thrown away each run, but the
    # project dir is bind-mounted, so this survives. Not find-links, which
    # loses to the index whenever the version ties.
    build-environment:
      - PIP_CACHE_DIR: $CRAFT_PROJECT_DIR/.pip-cache
      # pip's 15s default read timeout trips on a stalled chunk mid-wheel,
      # and its retries do not cover a mid-stream read.
      - PIP_TIMEOUT: "60"
      - PIP_RETRIES: "10"
    source: wheels
    python-packages:
      - ./myna-0.0.1-py3-none-any.whl[parakeet]
    build-packages:
      - python3-venv
    override-build: |
      craftctl default
      site=$(echo "$CRAFT_PART_INSTALL"/lib/python3.*/site-packages)
      # onnxruntime itself stays - it is this snap's whole runtime. Only its
      # build-time tooling and numpy's test suite go.
      export PRUNE_GATE="import onnxruntime, numpy; assert onnxruntime.InferenceSession"
      "$CRAFT_PROJECT_DIR/dev/prune-runtime.sh" "$site" "$CRAFT_PART_INSTALL/bin/python3"
      rm -f "$CRAFT_PART_INSTALL"/bin/pip* "$CRAFT_PART_INSTALL"/bin/onnxruntime_test

  engines:
    plugin: dump
    source: engines
    organize:
      "*": engines/

  runtimes:
    plugin: dump
    source: runtimes
    organize:
      "*": runtimes/

  models:
    plugin: dump
    source: models
    organize:
      "*": models/

  scripts:
    plugin: dump
    source: scripts
    stage-packages:
      - jq
    organize:
      "server.sh": bin/

  # Model weights as components. Populate components/ with
  # ./dev/download-models.sh before packing; `prime: [-*]` keeps them out of
  # the base. Whatever that stages is what ships.
  model-components:
    plugin: dump
    source: components
    # Craft only ever adds: a file DELETED from components/ survives in this
    # part's stage and prime dirs and ships anyway (measured - emptying
    # CRAFT_PART_INSTALL on rebuild does not clear it either). Dropping
    # a file therefore needs `snapcraft clean model-components` first, which is
    # how a dropped encoder kept reappearing in a 1.36 GB component.
    organize:
      "model-parakeet-int8/*": (component/model-parakeet-int8)/
      "model-parakeet-fp32/*": (component/model-parakeet-fp32)/
    prime:
      - -*

  # CUDA runtime as a component: the myna wheel's parakeet runtime with
  # onnxruntime-gpu in place of onnxruntime, and the NVIDIA CUDA 13 and cuDNN 9
  # pip libraries, under site-packages/. Exposed through PYTHONPATH and
  # LD_LIBRARY_PATH (runtimes/onnxruntime-cuda/runtime.yaml) and run by the
  # base python3.
  onnxruntime-cuda:
    plugin: nil
    # Offline from the wheelhouse dev/prepare.sh resolves: the exact closure of
    # the pins, hardlinked from a cache every checkout shares.
    source: wheelhouse-cuda
    build-packages:
      - python3
      - python3-pip
      - binutils
    override-build: |
      [ "$CRAFT_ARCH_BUILD_FOR" = amd64 ] || exit 0
      target="$CRAFT_PART_INSTALL/site-packages"
      mkdir -p "$target"
      # The wheel with no extra: its parakeet extra is the CPU onnxruntime,
      # which installs the same `onnxruntime` package over the GPU one.
      pip3 install --target="$target" --no-index --find-links=. \
        ./myna-0.0.1-py3-none-any.whl \
        --requirement "$CRAFT_PROJECT_DIR/runtimes/onnxruntime-cuda/requirements.txt"
      nvidia="$target/nvidia"
      # TensorRT's provider needs libnvinfer, which is not shipped; nvblas is
      # an LD_PRELOAD shim and cufftw the FFTW-compatible API. None has a caller.
      rm -f "$target"/onnxruntime/capi/libonnxruntime_providers_tensorrt.so \
            "$nvidia"/cu13/lib/libnvblas.so.* "$nvidia"/cu13/lib/libcufftw.so.*
      rm -rf "$nvidia"/*/include "$target"/bin
      # The library path runtimes/onnxruntime-cuda/runtime.yaml sets: the
      # pybind module itself links libcudart, so the import proves it too.
      export LD_LIBRARY_PATH="$nvidia/cu13/lib:$nvidia/cudnn/lib"
      export PRUNE_GATE="import onnxruntime, numpy; assert 'CUDAExecutionProvider' in onnxruntime.get_available_providers()"
      "$CRAFT_PROJECT_DIR/dev/prune-runtime.sh" "$target" python3
      unset LD_LIBRARY_PATH
      # The provider is dlopened, so a missing CUDA library only shows on a
      # user's GPU. Every library it needs must be in this component, except
      # the driver's libcuda.so.1 and the base's system libraries.
      provider="$target/onnxruntime/capi/libonnxruntime_providers_cuda.so"
      for lib in $(readelf -d "$provider" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
        case "$lib" in libcuda.so.1|libc.so.*|libm.so.*|libdl.so.*|librt.so.*|libpthread.so.*|libstdc++.so.*|libgcc_s.so.*|ld-linux-*) continue ;; esac
        [ -e "$nvidia/cu13/lib/$lib" ] || [ -e "$nvidia/cudnn/lib/$lib" ] || {
          echo "onnxruntime-cuda: $lib needed by the CUDA provider is not shipped" >&2
          exit 1
        }
      done
      craftctl default
    organize:
      "*": (component/onnxruntime-cuda)
    prime:
      - -*

components:
  model-parakeet-int8:
    type: standard
    summary: Parakeet TDT 0.6B v3 int8 ONNX weights
    description: |
      NVIDIA Parakeet TDT 0.6B v3 (CC-BY-4.0) int8 ONNX export — murmure's
      re-quantized encoder (robust across window lengths; istupakov's HF int8
      encoder collapses mid-audio on some lengths) + nemo128 preprocessor,
      TDT decoder_joint, vocab.
  model-parakeet-fp32:
    type: standard
    summary: Parakeet TDT 0.6B v3 fp32 ONNX weights for NVIDIA GPUs
    description: |
      NVIDIA Parakeet TDT 0.6B v3 (CC-BY-4.0) exported to ONNX by NeMo's own
      exporter from NVIDIA's checkpoint, with the nemo128 preprocessor and vocab.
  onnxruntime-cuda:
    type: standard
    summary: onnxruntime CUDA runtime (onnxruntime-gpu, CUDA 13, cuDNN 9)
    description: |
      GPU inference stack for the nvidia-gpu engine: myna + onnxruntime-gpu
      and the NVIDIA CUDA 13 and cuDNN 9 libraries. amd64 only.
