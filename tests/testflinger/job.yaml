# Myna's nightly lab run: the store's latest/edge snaps on one lab machine,
# through tests/testflinger/dut.sh at the submitting commit. submit.sh fills
# __QUEUE__ and __COMMIT__; the machine fetches everything else itself.
job_queue: __QUEUE__
global_timeout: 10800
output_timeout: 1200
provision_data:
  distro: noble
test_data:
  test_cmds: |
    #!/bin/bash
    set -u
    D=ubuntu@$DEVICE_IP
    for _ in $(seq 60); do ssh -n -o ConnectTimeout=10 $D true && break; sleep 10; done
    mkdir -p artifacts
    ssh -n $D 'git clone -q https://github.com/canonical/myna && git -C myna checkout -q __COMMIT__'
    # The sweep can be quiet for longer than output_timeout.
    (while sleep 300; do echo "heartbeat $(date -Is)"; done) &
    HB=$!
    ssh -n $D 'sudo myna/tests/testflinger/dut.sh' 2>&1 | tee artifacts/dut.log
    rc=${PIPESTATUS[0]}
    kill $HB
    scp "$D:myna/tests/testflinger/out/*.jsonl" "$D:myna/tests/testflinger/out/*.out" artifacts/ || true
    exit $rc
