# Thread pinning under confinement (T65).
#
# ONNX Runtime pins its intra-op thread pool, but the default snapd seccomp
# template allows only `sched_setaffinity 0 - -` - a *literal* pid 0 - while
# glibc's pthread_setaffinity_np always passes the target's real tid, even when
# a thread pins itself. Every pin is therefore refused with EPERM and the daemon
# runs unpinned while logging a wall of failures. `process-control` drops the
# argument filter.
#
# This ran silently wrong in the field for as long as parakeet existed, because
# nothing fails: ORT logs at [E] and carries on. So the test asserts both
# directions - the wall must appear without the interface and vanish with it -
# otherwise a change that quietly stopped ORT from pinning at all (an explicit
# intra_op_num_threads, say) would still "pass" the positive half.
#
# funasr is the subject because it is the smallest ORT snap (62 MB + 229 MB
# component); audio8 and sherpa behave identically but cost more to build.
# parakeet no longer belongs in that list: it caps its three sessions at 1/4/1
# and so never pins - the exact "quietly stopped pinning" case above, which is
# why it now ships without the interface.
# The static counterpart is server/tests/test_snap_packaging.py.
summary: ORT pins its thread pool once process-control is connected

environment:
    SNAP_UNDER_TEST: myna-funasr
    # Project directory, which does NOT track the snap name.
    SNAP_DIR: funasr-snap
    # The modelctl entry point. Never $SNAP_UNDER_TEST: every inference snap
    # names its CLI app after the *adapter* while the snap itself is namespaced
    # `myna-*`, so snapd always exposes it as `<snap>.<adapter>` - here
    # `myna-funasr.funasr`.
    MODELCTL: myna-funasr.funasr
    MODEL: sensevoice

prepare: |
    MYNA_SNAP=$(echo "$SPREAD_PATH"/myna-snap/myna_*_amd64.snap)
    ADAPTER_SNAP=$(echo "$SPREAD_PATH"/${SNAP_DIR}/${SNAP_UNDER_TEST}_*_amd64.snap)
    COMPONENT=$(echo "$SPREAD_PATH"/${SNAP_DIR}/${SNAP_UNDER_TEST}+model-${MODEL}.comp)
    test -f "$MYNA_SNAP" || { echo "client snap missing: build myna-snap first"; exit 1; }
    test -f "$ADAPTER_SNAP" || { echo "adapter snap missing: build ${SNAP_DIR} first"; exit 1; }
    test -f "$COMPONENT" || { echo "model component missing: ./dev/download-models.sh"; exit 1; }

execute: |
    set -x
    . "$SPREAD_PATH/tests/spread/lib/install.sh"
    MYNA_SNAP=$(echo "$SPREAD_PATH"/myna-snap/myna_*_amd64.snap)
    ADAPTER_SNAP=$(echo "$SPREAD_PATH"/${SNAP_DIR}/${SNAP_UNDER_TEST}_*_amd64.snap)
    COMPONENT=$(echo "$SPREAD_PATH"/${SNAP_DIR}/${SNAP_UNDER_TEST}+model-${MODEL}.comp)

    install_snap "$ADAPTER_SNAP" "$COMPONENT"
    snap connect ${SNAP_UNDER_TEST}:hardware-observe
    # Sideloading carries no snap declaration, so hardware-observe is
    # unconnected at install time and the install hook skips `use-engine
    # --auto`. That leaves no active engine and a daemon that exits 1 on every
    # start, which trips systemd's start limit and makes every later `snap
    # restart` fail. Clear the failed unit before selecting - same dance as
    # adapter-smoke.
    snap stop ${SNAP_UNDER_TEST}.server || true
    systemctl reset-failed snap.${SNAP_UNDER_TEST}.server.service || true
    ${MODELCTL} use-engine --auto --assume-yes --no-restart
    ${MODELCTL} use-model "$MODEL" --assume-yes

    install_snap "$MYNA_SNAP"
    snap connect myna:backend ${SNAP_UNDER_TEST}:ubustt-socket
    cp "$SPREAD_PATH/tests/spread/thread-pinning/fixture.wav" /var/snap/myna/current/fixture.wav

    # The interface must exist to be connectable at all - the failure mode this
    # guards is a snapcraft.yaml that quietly dropped the plug.
    snap connections ${SNAP_UNDER_TEST} | grep -q "process-control .*${SNAP_UNDER_TEST}:process-control"

    # Force a model load and wait for the daemon to settle. ORT attempts its
    # pinning during session construction, so a load is what produces (or fails
    # to produce) the affinity calls.
    load_model() {
        if ! snap restart ${SNAP_UNDER_TEST}.server; then
            echo "=== daemon refused to restart ==="
            systemctl status snap.${SNAP_UNDER_TEST}.server.service --no-pager || true
            snap logs -n 80 ${SNAP_UNDER_TEST}.server || true
            ${MODELCTL} status || true
            exit 1
        fi
        for _ in $(seq 1 90); do
            [ -S /var/snap/${SNAP_UNDER_TEST}/common/run/ubustt.sock ] && break
            sleep 1
        done
        if ! [ -S /var/snap/${SNAP_UNDER_TEST}/common/run/ubustt.sock ]; then
            echo "=== socket never appeared ==="
            snap logs -n 80 ${SNAP_UNDER_TEST}.server || true
            exit 1
        fi
        ( printf '\n'; sleep 60 ) | \
            myna.testbed --socket /var/snap/myna/current/backend/run/ubustt.sock \
                --clip /var/snap/myna/current/fixture.wav \
                --language en --no-realtime > "$1" 2>&1 || true
        cat "$1"
    }

    affinity_failures() {
        journalctl -u snap.${SNAP_UNDER_TEST}.server --since "$1" --no-pager \
            | grep -c "pthread_setaffinity_np failed" || true
    }

    # --- without process-control: seccomp must refuse every pin ---------------
    snap disconnect ${SNAP_UNDER_TEST}:process-control
    before=$(date '+%Y-%m-%d %H:%M:%S')
    sleep 1
    load_model unpinned.out
    denied=$(affinity_failures "$before")
    if [ "$denied" -eq 0 ]; then
        echo "FAIL: expected sched_setaffinity denials with process-control disconnected."
        echo "  Either the seccomp filter changed, or the adapter stopped letting ORT"
        echo "  size its own pool - in which case it is no longer pinning at all and"
        echo "  the positive half below proves nothing."
        exit 1
    fi

    # --- with process-control: the filter is lifted, pins succeed -------------
    # Connect *then* restart: seccomp filters are installed at exec, so a running
    # daemon keeps the profile it started with. This ordering is the bug every
    # fresh install hits once.
    snap connect ${SNAP_UNDER_TEST}:process-control
    before=$(date '+%Y-%m-%d %H:%M:%S')
    sleep 1
    load_model pinned.out
    remaining=$(affinity_failures "$before")
    if [ "$remaining" -ne 0 ]; then
        echo "FAIL: $remaining sched_setaffinity denials with process-control connected"
        journalctl -u snap.${SNAP_UNDER_TEST}.server --since "$before" --no-pager | tail -40
        exit 1
    fi

    # The clip must still transcribe: a daemon that pins but stopped working is
    # not a pass.
    grep -q '^✓ ' pinned.out
    if grep -q 'no speech detected' pinned.out; then
        echo "FAIL: pinned run produced no transcript"
        exit 1
    fi

restore: |
    snap remove --purge myna || true
    snap remove --purge ${SNAP_UNDER_TEST} || true
    rm -f unpinned.out pinned.out
