# The user daemon in the environment it is hardest to be correct in: a
# `systemd --user` instance with no graphical session at all - no compositor,
# no portal, no IBus, no backend, no session-bus desktop services. That is a
# real deployment (a lingering headless account, an SSH login, a machine
# sitting at the greeter), and it is where "resilient to all four boundaries"
# stops being a claim about mocks (T71b/T71c, decision recorded in
# myna-snap/README.md 2026-08-26).
#
# Four properties, each of which has been broken in this repo before:
#   1. it stays up rather than exiting into systemd's restart limit;
#   2. it says why once, not on every backoff step;
#   3. it does not *start* the desktop services it is missing;
#   4. a refresh restarts it onto the new revision.
summary: The user daemon survives a session with no desktop, quietly, without waking it

environment:
    USER_NAME: mynaspread

prepare: |
    # A sideloaded snap has no snap-id, and snapd rejects the install of any
    # user daemon that is neither allowlisted nor covered by this.
    snap set system experimental.user-daemons=true
    MYNA_SNAP=$(echo "$SPREAD_PATH"/myna-snap/myna_*_amd64.snap)
    test -f "$MYNA_SNAP" || { echo "client snap missing: build myna-snap first"; exit 1; }
    # A home under /home is load-bearing: `snap run` refuses to start for an
    # account whose home is outside it, which is exactly why the gdm greeter
    # never runs this daemon.
    useradd --create-home --shell /bin/bash "$USER_NAME"
    # Property 3 needs the portal to be *startable*, or "it did not start"
    # proves nothing. Nothing here ever starts it: there is no compositor, and
    # the unit is D-Bus activation only.
    apt-get install -y xdg-desktop-portal

execute: |
    set -x
    MYNA_SNAP=$(echo "$SPREAD_PATH"/myna-snap/myna_*_amd64.snap)
    snap install --dangerous "$MYNA_SNAP"

    # Lingering starts a user manager with no session behind it - the whole
    # point of the test.
    loginctl enable-linger "$USER_NAME"
    for i in $(seq 1 30); do
        systemctl --user -M "$USER_NAME@" is-active snap.myna.myna.service && break
        sleep 1
    done

    # 1. Up, and staying up. `NRestarts=0` is the assertion that matters: the
    # generated unit has no StartLimitBurst override, so a daemon that treated
    # any missing desktop service as fatal would be `failed` by now, not slow.
    sleep 30
    systemctl --user -M "$USER_NAME@" show snap.myna.myna.service \
        -p ActiveState -p SubState -p NRestarts > state.out
    cat state.out
    grep -qx "ActiveState=active" state.out
    grep -qx "NRestarts=0" state.out

    # 2. Quiet. With no portal the bind never succeeds, so the retry runs
    # forever; the operational tier states that once and the repeats drop to
    # MYNA_DEBUG. The daemon is parked on `NameOwnerChanged` rather than
    # polling, so in this window there is one attempt and one line, not one of
    # each per retry tick. The bound is 2
    # rather than 1 because a first attempt made before the session bus is up
    # can fail with a different reason than the ones after it, and a *changed*
    # reason is meant to be reported.
    journalctl _SYSTEMD_USER_UNIT=snap.myna.myna.service --no-pager \
        | grep -c "cannot bind activation" > lines.out || true
    cat lines.out
    test "$(cat lines.out)" -le 2

    # 3. It waits for a portal instead of launching one. Every D-Bus call is
    # auto-starting, so the daemon used to bring `xdg-desktop-portal` up itself
    # - and a portal started before the compositor exports
    # `XDG_CURRENT_DESKTOP` picks `gtk.portal` for every interface and never
    # `gnome.portal`, killing GlobalShortcuts for the whole session (found
    # 2026-08-26 on a real login). The reason string is asserted too: an
    # unowned name is the gate's own answer, not the bus's failure to activate.
    systemctl --user -M "$USER_NAME@" show-environment > env.out
    ! grep -q "^XDG_CURRENT_DESKTOP=" env.out
    journalctl _SYSTEMD_USER_UNIT=snap.myna.myna.service --no-pager \
        | grep -q "nothing owns org.freedesktop.portal.Desktop yet"
    systemctl --user -M "$USER_NAME@" is-active xdg-desktop-portal.service > portal.out || true
    cat portal.out
    grep -qx "inactive" portal.out

    # 4. A refresh restarts it onto the new revision, in a user manager that
    # nobody is logged into. Re-installing the same file is the sideload form
    # of a refresh: it makes a new revision and moves the unit to it.
    PID_BEFORE=$(systemctl --user -M "$USER_NAME@" show snap.myna.myna.service -p MainPID --value)
    snap install --dangerous "$MYNA_SNAP"
    for i in $(seq 1 30); do
        PID_AFTER=$(systemctl --user -M "$USER_NAME@" show snap.myna.myna.service -p MainPID --value)
        [ -n "$PID_AFTER" ] && [ "$PID_AFTER" != "0" ] && [ "$PID_AFTER" != "$PID_BEFORE" ] && break
        sleep 1
    done
    test "$PID_AFTER" != "$PID_BEFORE"
    systemctl --user -M "$USER_NAME@" is-active snap.myna.myna.service
    # On the new revision, not still running the old one.
    tr '\0' '\n' < "/proc/$PID_AFTER/cmdline" | grep -q "/snap/myna/$(readlink /snap/myna/current)/"

restore: |
    loginctl disable-linger "$USER_NAME" || true
    snap remove --purge myna || true
    userdel --remove "$USER_NAME" || true
