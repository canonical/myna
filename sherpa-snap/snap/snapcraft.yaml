# sherpa-onnx inference snap (UbuSTT) — feature 008 US4.
#
# The turnkey small streaming snap: a NeMo-family streaming FastConformer
# transducer (k2-fsa export, int8) via sherpa-onnx's OnlineRecognizer —
# native chunked streaming (continuous partials + rule endpointing) with no
# custom decode loop. Follows the parakeet-snap/whisper-snap pattern
# (modelctl v2 + one cpu engine + weights as a component). Weights: run
# ./dev/download-models.sh before packing. No `network` plug.
name: sherpa
base: core24
version: 0.1.0-dev
assumes:
  - snapd2.68 # components support
summary: sherpa-onnx streaming speech-to-text snap (UbuSTT)
description: |
  Local, offline speech-to-text service exposing the UbuSTT session API on a
  Unix domain socket. Wraps a streaming FastConformer transducer (NeMo
  family, k2-fsa ONNX export, int8) served via sherpa-onnx's
  OnlineRecognizer: continuous partial hypotheses plus endpoint-driven
  committed segments.

  The service receives PCM audio pushed by clients; it has no access to the
  microphone or any audio hardware.
grade: devel
confinement: strict
compression: lzo

platforms:
  amd64:

environment:
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR

apps:
  sherpa:
    command: bin/sherpa
    plugs: &hook-plugs
      # modelctl's hardware detection (lspci + /sys) backs `show-engine`,
      # `use-engine` and `status`. This snap ships one CPU engine and its
      # daemon does not need scoring to boot, but the modelctl surface is
      # meant to answer uniformly on every inference snap - without these the
      # CLI dies with "executing lspci: executable file not found".
      - hardware-observe
      - opengl

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      - network-bind # snapd seccomp gates listen() behind this, even for Unix sockets

hooks:
  install:
    plugs: *hook-plugs
  post-refresh:
    plugs: *hook-plugs

# Expose the session socket to confined clients (T14c).
slots:
  ubustt-socket:
    interface: content
    content: ubustt-socket
    source:
      write: [$SNAP_COMMON/run]

parts:
  cli:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.1/inference-snaps-cli-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.1/inference-snaps-cli-linux-arm64.tar.xz
    override-build: |
      mkdir -p bin
      mv cli bin/modelctl
      # Named symlink so cobra picks up the snap command name
      ln --symbolic ./modelctl bin/sherpa
      craftctl default

  # lspci, used by modelctl's hardware detection. Without it `use-engine --auto`
  # dies with "executing lspci: executable file not found", leaving the snap
  # with no active engine and a daemon that exits 1 on every start.
  cli-lspci:
    plugin: nil
    stage-packages:
      - pciutils

  server-app:
    # myna-server + sherpa-onnx + onnxruntime in a venv. The myna wheel is
    # staged into wheels/ by dev/prepare.sh before packing.
    plugin: python
    source: wheels
    python-packages:
      - ./myna-0.0.1-py3-none-any.whl[sherpa]
    build-packages:
      - python3-venv
    override-prime: |
      craftctl default
      # sherpa-onnx's native module NEEDs libonnxruntime.so with the
      # VERS_1.27.0 version node but the wheel doesn't bundle it — link the
      # pip onnxruntime's lib into sherpa_onnx.libs (on its RPATH). Relative
      # symlink, valid inside the packed snap.
      sp="$CRAFT_PRIME/lib/python3.12/site-packages"
      ln -sf ../onnxruntime/capi/libonnxruntime.so.1.27.0 \
        "$sp/sherpa_onnx.libs/libonnxruntime.so"

  engines:
    plugin: dump
    source: engines
    organize:
      "*": engines/

  runtimes:
    plugin: dump
    source: runtimes
    organize:
      "*": runtimes/

  models:
    plugin: dump
    source: models
    organize:
      "*": models/

  scripts:
    plugin: dump
    source: scripts
    stage-packages:
      - jq
    organize:
      "server.sh": bin/

  model-components:
    plugin: dump
    source: components
    organize:
      "model-fastconformer-480ms/*": (component/model-fastconformer-480ms)/
    prime:
      - -*

components:
  model-fastconformer-480ms:
    type: standard
    summary: Streaming FastConformer transducer (480ms) int8 ONNX
    description: |
      NeMo streaming FastConformer transducer (English) exported to ONNX by
      k2-fsa (sherpa-onnx-nemo-streaming-fast-conformer-transducer-en-480ms-int8):
      encoder/decoder/joiner + tokens. 480 ms latency variant (80/1040 ms
      variants exist upstream).
