name: cpu
summary: Streaming FastConformer transducer on sherpa-onnx, CPU
description: |
  Runs a NeMo-family streaming FastConformer transducer (int8 ONNX) with
  sherpa-onnx's OnlineRecognizer on amd64 CPUs — native chunked streaming
  (continuous partials + endpoint-driven commits) over the UbuSTT
  Unix-socket session API.
vendor: Canonical Ltd

devices:
  anyof:
    - type: cpu
      architecture: amd64

runtime: sherpa-onnx-cpu

model:
  default: fastconformer-transducer-480ms
  options:
    - fastconformer-transducer-480ms
