# One plugin: dev/gen-plugins.py turns this into the snapcraft component,
# models/disfluency-en/{myna-text-model.json,NOTICE} and catalog.json.
# Contract: .kb/text-plugin-contract.md.
# The component keeps its English-only name so the store's component and the
# e2e provisioning keep working; it serves four languages (see `languages`).
id = "myna-disfluency"
component = "model-disfluency-en"
snap = "myna-text"
kind = "disfluency-tagger"
task = "text.cleanup"
class = "edit"
needs = "sentence"
language = "en"
languages = ["en", "fr", "de", "es"]
tau = 0.6
license = "Apache-2.0"
attribution = "Canonical Ltd; fine-tuned from microsoft/Multilingual-MiniLM-L12-H384 (MIT)"
source = "https://huggingface.co/microsoft/Multilingual-MiniLM-L12-H384"
download_bytes = 45432832
entry_revision = 2
curated = true
pin = "myna-disfluency mini-v3"
locales = ["en", "fr", "de", "es"]
summary = "Disfluency tagger for English, French, German and Spanish (ONNX int8)"
description = """\
myna-disfluency, a multilingual MiniLM-L12 word tagger fine-tuned by
Canonical (Apache-2.0) that marks fillers, repeats, restarted phrases and
self-corrections for deletion in English, French, German and Spanish.
About 51 MB."""
notice = """\
model-disfluency-en: myna-disfluency, a multilingual disfluency tagger
(English, French, German, Spanish) fine-tuned by Canonical Ltd, Apache-2.0
(LICENSE in this component).

Base model: microsoft/Multilingual-MiniLM-L12-H384 (MIT License, Copyright (c)
Microsoft Corporation), https://huggingface.co/microsoft/Multilingual-MiniLM-L12-H384
revision 6e8c1ec6b4ec4e3fc6eb7d2cd834fcd582b61daf. Its vocabulary is the
XLM-RoBERTa SentencePiece vocabulary (FacebookAI/xlm-roberta-base, MIT License,
revision e73636d4f797dec63c3081bb6ed5c7b0bb3f2089), pruned to the pieces the
training text uses; tokenizer.json is that pruned tokenizer.

Training text derives from the following. The disfluencies are synthetic:
Canonical's own word lists and templates injected into the sentences (changes
made: sentence extraction and injection).

- English: SODA, Kim et al., https://huggingface.co/datasets/allenai/soda
  (revision fdc848ab0183208ea7808206c91c724414d0a071) and Synthetic-Persona-Chat,
