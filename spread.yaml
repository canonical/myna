# Spread project for myna (feature 006, US5) — confined multi-system
# end-to-end tests on clean systems. Decision record:
# specs/006-coverage-quality-gates/spread-decision.md
#
# Run locally (needs KVM):   spread qemu:ubuntu-24.04-64:tests/spread/
# Debug a failure:           spread -debug qemu:ubuntu-24.04-64:tests/spread/confined-e2e
#
# The snaps under test are prebuilt and sent with the project:
#   myna-snap/myna_*_amd64.snap              (myna-snap/dev/prepare.sh && snapcraft pack)
#   fake-snap/myna-fake-backend_*_amd64.snap (fake-snap/dev/prepare.sh && snapcraft pack)
project: myna

path: /home/spread/myna

backends:
    qemu:
        memory: 4G
        systems:
            - ubuntu-24.04-64:
                username: ubuntu
                password: ubuntu

# Keep the send small: the suite needs only the two snaps and tests/.
exclude:
    - .git
    - client/target
    - client
    - server/.venv
    - server
    - corpus
    - results
    - .coverage-work
    - .workshop
    - specs
    - docs
    - dev
    - extensions
    - .claude
    - .specify
    - .pi
    - .ruff_cache
    - whisper-snap
    - nemotron-snap
    - qwen-snap
    - sherpa-snap
    - parakeet-snap
    - fake-snap/stage
    - fake-snap/prime
    - fake-snap/parts
    - fake-snap/stage_packages
    - myna-snap/stage
    - myna-snap/prime
    - myna-snap/parts
    - myna-snap/stage_packages

suites:
    tests/spread/:
        summary: Confined end-to-end tests
