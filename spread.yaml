# Spread project for myna (feature 006, US5) — confined multi-system
# end-to-end tests on clean systems. Decision record:
# specs/006-coverage-quality-gates/spread-decision.md
#
# Run locally (needs KVM):   spread qemu:ubuntu-24.04-64:tests/spread/
# Debug a failure:           spread -debug qemu:ubuntu-24.04-64:tests/spread/confined-e2e
#
# The snaps under test are prebuilt and sent with the project:
#   myna-snap/myna_*_amd64.snap              (myna-snap/dev/prepare.sh && snapcraft pack)
#   fake-snap/myna-fake-backend_*_amd64.snap (fake-snap/dev/prepare.sh && snapcraft pack)
#   whisper-snap/whisper_*_amd64.snap        (whisper-snap/dev/prepare.sh && snapcraft pack)
#   whisper-snap/whisper+model-tiny.comp     (whisper-snap/dev/download-models.sh)
#
# confined-e2e uses the fake backend (no model, runs anywhere); adapter-smoke
# uses the real whisper snap to prove a shipped adapter is wired up in both
# emission modes. 4 GB of VM RAM is enough for whisper-tiny on CPU.
project: myna

path: /home/spread/myna

backends:
    qemu:
        memory: 4G
        systems:
            - ubuntu-24.04-64:
                username: ubuntu
                password: ubuntu

# Keep the send small: the suite needs only the two snaps and tests/.
exclude:
    - .git
    - client/target
    - client
    - server/.venv
    - server
    - corpus
    - results
    - .coverage-work
    - .workshop
    - specs
    - docs
    - dev
    - extensions
    - .claude
    - .specify
    - .pi
    - .ruff_cache
    # whisper-snap is *not* excluded wholesale: adapter-smoke needs the packed
    # snap and the tiny component (161 MB + 76 MB). Its build trees and the
    # larger components are dropped instead - shipping base/small/CUDA would add
    # 2.3 GB to every send for no extra coverage.
    - whisper-snap/parts
    - whisper-snap/stage
    - whisper-snap/prime
    - whisper-snap/stage_packages
    - whisper-snap/components
    - whisper-snap/wheels
    - whisper-snap/whisper+model-base.comp
    - whisper-snap/whisper+model-small.comp
    - whisper-snap/whisper+faster-whisper-cuda.comp
    - nemotron-snap
    - qwen-snap
    - sherpa-snap
    - parakeet-snap
    - fake-snap/stage
    - fake-snap/prime
    - fake-snap/parts
    - fake-snap/stage_packages
    - myna-snap/stage
    - myna-snap/prime
    - myna-snap/parts
    - myna-snap/stage_packages

suites:
    tests/spread/:
        summary: Confined end-to-end tests
